<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 플래너</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#3b3530; --sub:#9a9086; --line:#e9e2d6; --soft:#f1ebe0;
  --accent:#d9846a; --accent-ink:#fff; --now:#e5534b; --star:#e2b23c;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171513; --card:#211e1b; --ink:#f0e9df; --sub:#9b9288; --line:#332f2a; --soft:#2b2723;
    --accent:#e59a82; --accent-ink:#2a1a14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171513; --card:#211e1b; --ink:#f0e9df; --sub:#9b9288; --line:#332f2a; --soft:#2b2723;
  --accent:#e59a82; --accent-ink:#2a1a14; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;max-width:920px;margin:0 auto;display:flex;flex-direction:column}
#app.wide{max-width:1180px}
.dayg{display:flex;flex-direction:column-reverse}
.dayg>*{min-width:0}
@media (min-width:760px){
  .dayg{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,34%);gap:12px;align-items:start}
  .side{position:sticky;top:0}
}
.tl{padding:6px 12px}
.tl-h{display:flex;align-items:baseline;gap:8px;margin:8px 2px 6px}
.tl-h b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tl-h span{color:var(--sub);font-size:14px}
.hr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);min-height:58px;align-items:start}
.hr:last-child{border-bottom:0}
.hr .t{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:6px;text-align:left}
.hr.cur{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px}
.hr.cur .t{color:var(--accent);font-weight:700}
.hr .body{display:flex;flex-direction:column;gap:5px;min-width:0}
.hrow{display:flex;flex-wrap:wrap;gap:5px}
.hchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:8px;background:var(--c);color:#fff;font-size:13px;font-weight:600;text-align:left}
.hchip small{font-size:11px;opacity:.9;font-weight:500;white-space:nowrap}
.hchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip.ev{background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink);border-left:3px solid var(--c)}
.hchip.gp{background:transparent;color:var(--sub);border:1.5px dashed color-mix(in srgb,var(--sub) 45%,transparent);font-weight:600}
.hin{width:100%;border:0;background:transparent;padding:6px 0;font-size:15px;min-width:0}
.hin::placeholder{color:var(--sub);opacity:.7}
.hin:focus{outline:none;border-bottom:1px solid var(--accent)}
.donelbl{font-size:12px;color:var(--sub);margin:14px 2px 2px}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--sub);font-size:12px;margin-top:2px;white-space:nowrap}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-size:19px;line-height:1;flex:none;text-align:center}
.tbtn{height:34px;padding:0 12px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:600;flex:none;text-align:center}
.plus{background:var(--ink);color:var(--bg)}
main{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 20px;-webkit-overflow-scrolling:touch}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px 8px;border-top:1px solid var(--line);background:var(--card)}
.nav button{padding:9px 0;border-radius:10px;font-size:13px;color:var(--sub);font-weight:600;text-align:center}
.nav button.on{background:var(--soft);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.friendrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.friendrow>div:first-child{min-width:0}.friendrow b,.friendrow small{display:block}.friendrow small{font-size:12px;color:var(--sub);margin-top:3px}.friendacts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.friendacts .tbtn{height:30px;padding:0 8px;font-size:11px}.friendacts .tbtn.on{background:var(--ink);color:var(--bg)}.friend-plan{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.friend-plan small{color:var(--sub)}
.friend-plan-day{padding:10px 0;border-top:1px solid var(--line)}.friend-plan-day>b{display:block;margin-bottom:6px;font-size:14px}.friend-plan-item{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;border-radius:8px;background:var(--soft);margin-top:4px;font-size:13px}.friend-plan-item small{color:var(--sub);white-space:nowrap}
.memory-lines{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}.memory-lines button,.station-grid button{height:32px;padding:0 9px;border-radius:9px;background:var(--soft);font-size:12px;font-weight:700}.memory-lines button.on,.station-grid button.on{background:var(--ink);color:var(--bg)}.station-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-height:210px;overflow:auto;margin-bottom:12px}.station-grid button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memory-card{padding:10px;border-radius:12px;background:var(--soft);margin:7px 0}.memory-card b,.memory-card small{display:block}.memory-card small{color:var(--sub);margin-top:4px;line-height:1.45}.memory-empty{padding:14px 0;color:var(--sub);font-size:13px}.pwrow{display:flex;align-items:center;gap:6px;margin:8px 0}.pwrow .fld{margin:0;flex:1}.pw-eye{width:42px;height:42px;border-radius:11px;background:var(--soft);display:grid;place-items:center}.pw-eye svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.gsearch{display:flex;align-items:center;gap:8px;margin:0 0 12px}.gsearch input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}.gsearch input:focus{border-color:var(--accent);outline:none}.gsearch-close{height:36px;padding:0 10px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:600;flex:none}.gresult-count{font-size:12px;color:var(--sub);margin:0 2px 8px}.gresults{display:flex;flex-direction:column;gap:6px;max-height:58vh;overflow-y:auto}.gresult{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:var(--soft);text-align:left}.gresult:active{background:var(--line)}.gresult-type{flex:none;min-width:44px;color:var(--sub);font-size:11px;font-weight:700}.gresult-main{min-width:0;flex:1}.gresult-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}.gresult-meta{display:block;margin-top:3px;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gresult-arrow{flex:none;color:var(--sub);font-size:17px}
.requestbox{padding:14px;border-radius:14px;background:var(--soft);margin:10px 0 14px}.requestbox b,.requestbox small{display:block}.requestbox small{color:var(--sub);margin-top:5px;line-height:1.5}
.card.warn{border-color:color-mix(in srgb,var(--now) 45%,var(--line))}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.note{margin:8px 2px;padding:8px 10px;border-radius:10px;background:var(--soft);color:var(--sub);font-size:12px}
.hint{font-size:12px;color:var(--sub);margin:0 2px 10px;line-height:1.5}

/* month */
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mh span{text-align:center;font-size:12px;color:var(--sub);padding:2px 0 6px}
.mh span:nth-child(6){color:#6b8dc7}
.mh span:nth-child(7){color:#d0705f}
.mg{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:86px;padding:3px 2px;
  display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0;align-items:stretch}
.cell.out{opacity:.38}
.cell .n{font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums;align-self:flex-start}
.cell.we .n{color:#d0705f}
.cell.we:nth-child(7n+6) .n{color:#6b8dc7}
.cell.today .n{background:var(--accent);color:var(--accent-ink);font-weight:700}
.dots{display:flex;gap:2px;flex-wrap:wrap;min-height:5px;padding-left:2px}
.dots i{width:5px;height:5px;border-radius:50%}
.chip{display:block;font-size:9.5px;line-height:1.3;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ev{background:var(--c);color:#fff}
.chip.td{color:var(--sub);background:var(--soft)}
.more{font-size:9.5px;color:var(--sub);padding-left:2px}

/* timetable grid */
.tt-card{padding:8px 4px}
.tt-card .card-h{margin:0 8px 6px}
.tt-head,.tt-body{display:grid;grid-template-columns:28px repeat(var(--n),minmax(0,1fr))}
.tt-head button{padding:2px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.tt-head b{font-size:14px;color:var(--ink);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.tt-head .today b{background:var(--accent);color:var(--accent-ink)}
.tt-body{position:relative}
.tt-hrs{position:relative;height:var(--h)}
.tt-hrs span{position:absolute;right:4px;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.tt-col{position:relative;height:var(--h);border-left:1px solid var(--line);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.tt-col.today{background-color:color-mix(in srgb,var(--accent) 7%,transparent)}
.blk{position:absolute;display:block;border-radius:7px;padding:3px 4px;overflow:hidden;color:#fff;font-size:10.5px;line-height:1.25;
  background:var(--c);text-shadow:0 1px 1px rgba(0,0,0,.18);word-break:break-all;text-align:left}
.blk b{display:block;font-weight:700}
.blk small{display:block;font-size:9.5px;opacity:.92;margin-top:1px}
.blk.ev{background:var(--soft);background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink);text-shadow:none;border-left:3px solid var(--c)}
.tt.day .blk{font-size:13px;padding:6px 9px;border-radius:9px}
.tt.day .blk small{font-size:11px}
.tt.day .tt-body{grid-template-columns:34px minmax(0,1fr)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);font-variant-numeric:tabular-nums}
.slot.c{background:var(--c);color:#fff;font-weight:600}
.dd{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;display:inline-block;background:var(--soft);color:var(--sub);text-decoration:none}
.dd.soon{background:color-mix(in srgb,var(--accent) 20%,var(--card));color:var(--accent)}
.dd.hot{background:var(--now);color:#fff}
.dd.late{background:var(--soft);color:var(--now)}
.rp{font-style:normal;font-size:11px;color:var(--sub);margin-left:6px;white-space:nowrap}
.chip.due{background:transparent;color:var(--now);border:1px solid color-mix(in srgb,var(--now) 50%,transparent);padding:0 3px}
.gap{position:absolute;left:2px;right:2px;border-radius:7px;border:1.5px dashed color-mix(in srgb,var(--sub) 45%,transparent);
  background:color-mix(in srgb,var(--sub) 6%,transparent);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-align:center;line-height:1.2;padding:0 2px}
.tt.day .gap{font-size:12px}
.duebox{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--sub)}
.duebox input{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-size:14px;flex:1;min-width:0}
.duebox button{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--soft);font-weight:600}
.rt{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.rt:last-child{border-bottom:0}
.ctag{font-style:normal;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px 1px 5px;margin-left:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
  max-width:9em;overflow:hidden;text-overflow:ellipsis;vertical-align:1px;background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);text-decoration:none}
.ctag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
select.fld,.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.sel{height:36px;border-radius:10px;border:1px solid var(--line);background-color:var(--bg);padding-left:8px;font-size:14px;flex:1;min-width:0;color:var(--ink)}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:8px 0 0;padding:10px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--now) 10%,var(--card));border:1px solid color-mix(in srgb,var(--now) 30%,var(--line));font-size:14px;font-weight:700}
.exbar small{font-size:12px;color:var(--sub);font-weight:500}
.exbar b{color:var(--ink);font-variant-numeric:tabular-nums}
.cell.exam{background:color-mix(in srgb,var(--now) 8%,transparent)}
.cname{font-weight:700;display:inline-flex;align-items:center;gap:6px;text-align:left}
.cname em{font-style:normal;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0 2px}
.big small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.rt .ttxt small{display:block;color:var(--sub);font-size:12px;margin-top:2px}

/* todos */
.todos{list-style:none;margin:0;padding:0}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700;margin-top:1px;text-align:center}
.todo.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ttxt{flex:1;min-width:0;line-height:1.45;padding-top:1px;word-break:break-word;cursor:pointer}
.todo.done .ttxt{color:var(--sub);text-decoration:line-through}
.tag{font-style:normal;font-size:11px;color:var(--sub);background:var(--soft);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;text-decoration:none;display:inline-block}
.star{flex:none;font-size:18px;color:var(--line);line-height:1;padding:2px;text-align:center}
.star.on{color:var(--star)}
.mini{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--soft);text-align:center}.mini.on{background:var(--ink);color:var(--bg)}.mini:disabled{opacity:.48;cursor:not-allowed}
.tododel{width:24px;height:24px;padding:0;border-radius:50%;font-size:16px;line-height:24px;color:var(--sub)}
.empty{color:var(--sub);font-size:13px;padding:8px 2px}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin:0 2px 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.add input:focus{border-color:var(--accent);outline:none}
.add button{height:42px;padding:0 15px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;text-align:center}
.memo{width:100%;min-height:96px;resize:vertical;border:0;border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px;line-height:1.5}
.memo:focus{outline:2px solid var(--accent)}
.memo-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.memo-photo{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;background:var(--soft)}
.memo-photo img{width:100%;height:100%;object-fit:cover}
.memo-photo .lt-x{position:absolute;top:3px;right:3px;background:rgba(28,28,30,.62);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px}
.memo-addphoto{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;height:34px;padding:0 12px;font-size:13px}

/* timetable list */
.course{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.course:last-of-type{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px;flex:none}
.course .nm{font-weight:700}
.course .cd{font-size:12px;color:var(--sub);margin-left:6px}
.course .slots{margin-top:7px}
.course-overview{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.course-overview .lbl{margin:0 0 6px;color:var(--sub)}
.course-line{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.course-line b{font-size:12px;min-width:42px;color:var(--sub);font-variant-numeric:tabular-nums}
.course-line span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-class{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0 10px;padding:12px 14px;border-radius:14px;background:var(--c);color:#1c1c1e;text-align:left}
.next-class>span{display:block;flex:1;min-width:0}
.next-class small,.next-class b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-class small{font-size:11px;opacity:.68;margin-bottom:3px}
.next-class b{font-size:15px}
.next-class em{font-style:normal;font-size:12px;white-space:nowrap}
.next-class .chev{font-size:22px;opacity:.55}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow span{font-size:14px}

/* modal */

#modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:20px;padding-bottom:16px}}
.sheet h3{margin:0 0 12px;font-size:17px}
.onboard{text-align:center;padding:8px 2px 2px}.onboard .hint{max-width:330px;margin:0 auto 16px}.onboard-dots{display:flex;justify-content:center;gap:5px;margin:0 0 18px}.onboard-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.onboard-dots i.on{background:var(--accent)}.onboard .pal{justify-content:center}.onboard-demo{min-height:72px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--soft);margin:10px 0 16px;font-weight:700;color:var(--ink)}
.fld{display:block;width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;margin-bottom:10px}
.fld:focus{border-color:var(--accent);outline:none}
.fld.bad{border-color:var(--now)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.row .fld{margin:0;flex:1;min-width:0}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{padding:7px 13px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.seg button.on{background:var(--ink);color:var(--bg)}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 2px 14px}
.ck input{width:18px;height:18px;accent-color:var(--accent)}

.acts button{flex:1;height:44px;border-radius:12px;font-weight:700;font-size:15px;text-align:center}
.b-save{background:var(--ink);color:var(--bg)}
.b-ghost{background:var(--soft)}
.b-del{background:var(--soft);color:#c9524a;flex:0 0 auto!important;padding:0 16px}
.b-del.armed{background:#c9524a;color:#fff}
.ta{display:block;width:100%;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-bottom:10px;resize:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ===== 테마: 화이트 미니멀 ===== */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1c1c1e; --sub:#8e8e93; --line:#eeeef1; --soft:#f4f4f6;
  --accent:#1c1c1e; --accent-ink:#ffffff; --now:#ff4d4f; --star:#f5b83d; --edge:#e8e8ec; --hi:#f7f7f9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#111113; --ink:#f5f5f7; --sub:#8e8e93; --line:#242427; --soft:#1c1c1f;
    --accent:#f5f5f7; --accent-ink:#000000; --now:#ff6b6b; --edge:#2a2a2e; --hi:#18181b;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#111113; --ink:#f5f5f7; --sub:#8e8e93; --line:#242427; --soft:#1c1c1f;
  --accent:#f5f5f7; --accent-ink:#000000; --now:#ff6b6b; --edge:#2a2a2e; --hi:#18181b;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  background:var(--bg);letter-spacing:-.01em}
h1,h3,.nm,.cname,.big,.tl-h b{font-weight:700;letter-spacing:-.025em}
.top{padding:16px 16px 10px}
.ttl h1{font-size:22px}
.ttl small{font-size:13px}
.ibtn,.tbtn{background:var(--soft);border:0;font-weight:600}
.plus{background:var(--accent);color:var(--accent-ink)}
main{padding:0 14px 24px}
.nav{background:var(--bg);border-top:1px solid var(--line);gap:2px;padding:6px 8px 8px}
.nav button{color:var(--sub);font-weight:600}
.nav button.on{background:transparent;color:var(--ink);font-weight:800}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px;box-shadow:none}
.card-h h3{font-size:16px}
.card.warn{background:var(--card);border-color:color-mix(in srgb,var(--now) 40%,var(--edge))}
.bar{height:4px;border-radius:2px;background:var(--soft)}
.bar i{background:var(--accent)}
.chk{border:1.5px solid #c7c7cc}
.todo.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.todo{border-bottom-color:var(--line)}
.add input,.fld,.sel,.duebox input,.memo{background:var(--soft);border:1px solid transparent;border-radius:10px}
.add input:focus,.fld:focus{border-color:var(--ink);background:var(--card)}
.add button,.b-save{background:var(--accent);color:var(--accent-ink);border-radius:10px}
.b-ghost{background:var(--soft)}
.seg button{background:var(--soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.mh span{font-weight:600}
.mg{border:0}
.cell{border:0;border-top:1px solid var(--line)}
.cell.today .n,.tt-head .today b{background:var(--accent);color:var(--accent-ink)}
.tt-col{border-left:1px solid var(--line)}
.tt-col.today{background-color:var(--hi)}
.tt-head b{font-weight:700}
.cell.exam{background:color-mix(in srgb,var(--now) 6%,transparent)}
.exbar{background:var(--card);border:1px solid var(--edge);border-radius:14px}
.exbar b{color:var(--ink)}
/* 수업·일정: 연한 칠 + 왼쪽 색 막대 */
.blk{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);text-shadow:none;border:0;border-left:3px solid var(--c);border-radius:6px;font-weight:500}
.blk b{font-weight:700}
.blk small{color:var(--sub);opacity:1}
.blk.ev{background:var(--card);border:1px solid var(--edge);border-left:3px solid var(--c)}
.chip.ev{background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--ink);border-left:2px solid var(--c);border-radius:3px}
.chip.td{background:var(--soft)}
.chip.due{border-radius:3px}
.slot{background:var(--soft)}
.slot.c{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);border-left:3px solid var(--c);border-radius:8px}
.hchip{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);border:0;border-left:3px solid var(--c);border-radius:6px}
.hchip small{color:var(--sub);opacity:1}
.hchip.ev{background:var(--card);border:1px solid var(--edge);border-left:3px solid var(--c)}
.ctag{background:var(--soft)}
.gap{border:1px dashed var(--edge);background:transparent;color:#b0b0b6;font-weight:500}
.hchip.gp{border:1px dashed var(--edge);border-left:1px dashed var(--edge);background:transparent;color:var(--sub);font-weight:500}
/* 일간 */
.hr{border-bottom:1px solid var(--line);min-height:54px}
.hr .t{font-size:13px;font-weight:500}
.hr.cur{background:var(--hi);border-radius:10px}
.hr.cur .t{color:var(--now);font-weight:700}
.tl-h b{font-size:26px}
.dd{background:var(--soft);color:var(--sub)}
.dd.soon{background:var(--soft);color:var(--ink)}
.dd.hot{background:var(--now);color:#fff}
.dd.late{background:transparent;color:var(--now)}
.cname em{background:var(--accent);color:var(--accent-ink)}
.sw{border-color:var(--card)}
.sheet{border-radius:18px 18px 0 0}

/* ===== 블록: 연한 단색 칠 ===== */
.blk,.hchip,.slot.c,.chip.ev{background:var(--c);color:#1c1c1e;border:0;border-left:0}
.blk small,.hchip small{color:rgba(28,28,30,.55)}
.blk.ev,.hchip.ev{background:var(--card);color:var(--ink);border:1px solid var(--edge);border-left:3px solid color-mix(in srgb,var(--c) 70%,#555)}
.blk.ev small,.hchip.ev small{color:var(--sub)}
.hchip.gp{background:transparent;color:var(--sub);border:1px dashed var(--edge)}
.dots i{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.cdot{width:18px;height:18px;border-radius:50%;background:var(--c);flex:none;margin-top:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw{box-shadow:0 0 0 1px var(--edge),inset 0 0 0 1px rgba(0,0,0,.06)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw.big{width:40px;height:40px}
.pal{gap:12px}

/* 다크모드: 베이지 → 회색 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) :is(.blk,.hchip,.slot,.chip,.adchip)[style*="#faefdc"]:not(.ev){background:#3a3a3c;color:#f2f2f4}
  :root:not([data-theme="light"]) :is(.blk,.hchip)[style*="#faefdc"]:not(.ev) small{color:rgba(242,242,244,.6)}
  :root:not([data-theme="light"]) :is(.cdot,.sw)[style*="#faefdc"]{background:#3a3a3c}
  :root:not([data-theme="light"]) .dots i[style*="#faefdc"]{background:#5a5a5e !important}
}
:root[data-theme="dark"] :is(.blk,.hchip,.slot,.chip,.adchip)[style*="#faefdc"]:not(.ev){background:#3a3a3c;color:#f2f2f4}
:root[data-theme="dark"] :is(.blk,.hchip)[style*="#faefdc"]:not(.ev) small{color:rgba(242,242,244,.6)}
:root[data-theme="dark"] :is(.cdot,.sw)[style*="#faefdc"]{background:#3a3a3c}
:root[data-theme="dark"] .dots i[style*="#faefdc"]{background:#5a5a5e !important}

.tt-ad{display:grid;grid-template-columns:28px repeat(var(--n),minmax(0,1fr));border-top:1px solid var(--line);padding:4px 0}
.tt-ad>span{font-size:10px;color:var(--sub);padding-top:5px}
.tt-ad>div{display:flex;flex-direction:column;gap:3px;padding:0 2px;min-width:0}
.adchip{display:block;width:100%;background:var(--c);color:#1c1c1e;border-radius:6px;padding:3px 5px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tl-h{align-items:center}

.gear{background:transparent}
.lnk{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}

.setrow .seg button{padding:6px 12px}

/* ===== 땡땡이 배경 ===== */

:root[data-bg="white"]:not([data-theme="dark"]) body{background-color:#fffdfd;background-image:radial-gradient(circle,#fbd3dc 3.2px,transparent 3.8px),radial-gradient(circle,#fbd3dc 3.2px,transparent 3.8px);background-size:40px 40px;background-position:0 0,20px 20px;background-attachment:fixed}
:root[data-bg="beige"]:not([data-theme="dark"]) body{background-color:#fbf0e0;background-image:radial-gradient(circle,#fffaf2 2.4px,transparent 3px),radial-gradient(circle,#fffaf2 2.4px,transparent 3px);background-size:40px 40px;background-position:0 0,20px 20px;background-attachment:fixed}
}

.bgs{display:flex;gap:8px;flex:none}

.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}

.optlink{font-size:13px;color:var(--sub);margin-top:10px;padding:4px 2px}
.fbtn{width:100%;height:44px;margin:0 0 10px;text-align:center}
.fsub{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:4px}
.fclock{font-size:64px;font-weight:800;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:18px 0 4px}

function allSchoolProfiles(state){
  var cfg=state||(typeof S!=='undefined'?S:null),custom=cfg&&cfg.settings&&Array.isArray(cfg.settings.customSchools)?cfg.settings.customSchools:[];
  return SCHOOL_PROFILES.concat(custom).slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''),'ko');});
}
function schoolProfile(id,state){return allSchoolProfiles(state).find(function(x){return x.id===id;})||SCHOOL_PROFILES[0];}
function schoolName(id){return schoolProfile(id).name;}
function canonicalCampus(id,campus){
  var p=schoolProfile(id),raw=String(campus||'');
  return p.campuses.find(function(c){return c===raw;})||p.campuses.find(function(c){return raw.indexOf(c)>=0||c.indexOf(raw)>=0;})||p.campuses[0]||'';
}
function schoolHost(url){return String(url||'').replace(/^https?:\/\//i,'').split('/')[0];}
function schoolSearchUrl(url,query){return 'https://search.naver.com/search.naver?query='+encodeURIComponent('site:'+schoolHost(url)+' '+query);}
function schoolLinks(id,campus){
  var p=schoolProfile(id),camp=campus||p.campuses[0]||'',campusList=CAMPUS_LINKS[id]&&CAMPUS_LINKS[id][campus];
  var list=(campusList||p.links||[]).map(function(l){return {name:l.name,url:l.url};}),names=list.map(function(l){return l.name||'';}).join(' ');
  return list.map(function(l){return {id:uid(),name:l.name,url:l.url,schoolLink:true};});
}
function isGeneratedSchoolLink(l){
  if(!l)return false;
  if(l.schoolLink===false)return false;
  if(l.schoolLink===true)return true;
  var u=String(l.url||'').replace(/\/$/,'');
  if(/^https:\/\/search\.naver\.com\/search\.naver\?query=site%3A/i.test(u))return true;
  var found=false;
  function scan(arr){(arr||[]).forEach(function(x){if(x&&String(x.url||'').replace(/\/$/,'')===u)found=true;});}
  SCHOOL_PROFILES.forEach(function(p){scan(p.links);Object.keys(CAMPUS_LINKS[p.id]||{}).forEach(function(k){scan(CAMPUS_LINKS[p.id][k]);});});
  return found;
}
function schoolOptions(sel){return allSchoolProfiles().map(function(x){return '<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'<option value="__add__">+ 내 학교 직접 추가</option>';}
function schoolDatalist(){return allSchoolProfiles().map(function(x){return '<option value="'+esc(x.name)+'">';}).join('');}
function setSchool(id,campus){
  var p=schoolProfile(id),custom=(S.settings.links||[]).filter(function(l){return !isGeneratedSchoolLink(l);});
  var nextCampus=canonicalCampus(p.id,campus);
  S.settings.school=p.id;S.settings.schoolCampus=nextCampus;
  S.settings.links=schoolLinks(p.id,nextCampus).concat(custom);
  save();
}

/* ---------- 무거운 백업은 IndexedDB에 ----------
   예전엔 전체 사본(자동 백업 20개 + 날짜별 30개 + 로그아웃·정상상태 등)을 전부
   localStorage(약 5MB)에 넣어서 금방 꽉 찼고, 그 뒤로는 백업·저장이 조용히 실패했어요.
   이제 큰 사본은 전부 IndexedDB에 두고 localStorage엔 지금 상태만 둬요. */
var BK={db:null,wait:null,lastGoodAt:0};
function bkOpen(){
  if(BK.db)return Promise.resolve(BK.db);
  if(BK.wait)return BK.wait;
  BK.wait=new Promise(function(res){
    try{
      if(!window.indexedDB){res(null);return;}
      var req=indexedDB.open('planner-safe-backups-v1',2);
      req.onupgradeneeded=function(){var d=req.result;
        if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
      req.onsuccess=function(){BK.db=req.result;res(BK.db);};
      req.onerror=function(){res(null);};
      req.onblocked=function(){res(null);};
    }catch(e){res(null);}
  });
  return BK.wait;
}
function bkPut(k,raw){
  if(!raw)return Promise.resolve(false);
  return bkOpen().then(function(db){
    if(!db){try{localStorage.setItem('planner.bk.'+k,raw);return true;}catch(e){return false;}}
    return new Promise(function(res){try{var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put({at:Date.now(),raw:raw},k);tx.oncomplete=function(){res(true);};tx.onerror=tx.onabort=function(){res(false);};}catch(e){res(false);}});
  });
}
function bkGetRec(k){
  return bkOpen().then(function(db){
    if(!db){var r=lsGet('planner.bk.'+k);return r?{at:0,raw:r}:null;}
    return new Promise(function(res){try{var q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=function(){res(q.result&&q.result.raw?q.result:null);};q.onerror=function(){res(null);};}catch(e){res(null);}});
  });
}
function bkDel(k){
  return bkOpen().then(function(db){
    if(!db){try{localStorage.removeItem('planner.bk.'+k);}catch(e){}return;}
    try{db.transaction('kv','readwrite').objectStore('kv').delete(k);}catch(e){}
  });
}
/* 계정별 키를 먼저 찾고, 없으면 공용 키 */
function bkFirst(keys){

/* 자동 백업 기록 (최근 40개, 평소엔 5분에 한 번) */
function bkRingAdd(st,force){
  if(!st||!hasPlannerData(st))return Promise.resolve(false);
  var last=+(lsGet('planner.idbAt')||0);
  if(!force&&Date.now()-last<5*60000)return Promise.resolve(false);

  var owner=bkOwner();

    if(!db)return false;
    return new Promise(function(res){try{var tx=db.transaction('snapshots','readwrite'),os=tx.objectStore('snapshots');
      os.add({at:Date.now(),owner:owner,data:data});
      var kr=os.getAllKeys();kr.onsuccess=function(){var ks=kr.result||[];ks.slice(0,Math.max(0,ks.length-40)).forEach(function(k){os.delete(k);});};
      tx.oncomplete=function(){res(true);};tx.onerror=tx.onabort=function(){res(false);};}catch(e){res(false);}});
  });
}
function bkRingList(){
  return bkOpen().then(function(db){
    if(!db)return [];
    return new Promise(function(res){try{var q=db.transaction('snapshots','readonly').objectStore('snapshots').getAll();q.onsuccess=function(){res((q.result||[]).sort(function(a,b){return b.at-a.at;}));};q.onerror=function(){res([]);};}catch(e){res([]);}});

function bkMigrate(){
  var moves=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k)continue;var m=null;
    if(k==='planner.logoutBackup')m='logout';

    else if(k==='planner.lastGoodBackup')m='lastGood';
    else if(k.indexOf('planner.lastGoodBackup.')===0)m='lastGood.'+k.slice(23);
    else if(k==='planner.remoteBackup')m='remote';
    else if(k==='planner.prevBackup')m='prev';
    else if(k.indexOf('planner.snap.')===0)m='snap.'+k.slice(13);

      var raw=lsGet(mv[0]);if(!raw)return;
      if(mv[1]==='__ring'){
        var ring=[];try{ring=JSON.parse(raw)||[];}catch(e){}
        return new Promise(function(res){try{var tx=db.transaction('snapshots','readwrite'),os=tx.objectStore('snapshots');
          (Array.isArray(ring)?ring:[]).forEach(function(x){if(x&&x.data)os.add({at:x.at||0,owner:'',data:x.data});});

      }

function decodeBackupCode(code){
  var text=String(code||'').trim();
  if(!text)throw new Error('empty backup');
  /* 코드 칸에 JSON을 직접 붙여넣은 경우도 함께 지원해요. */
  try{return JSON.parse(text);}catch(e){}
  var b64=text.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');

function friendPush(){
  var sb=friendDb();if(!sb||!FriendSync.loaded||FriendSync.busy)return Promise.resolve();

    if(f.outCalendar)rows.push({owner_id:Sync.uid,friend_id:f.id,kind:'calendar',payload:friendPayload('calendar'),updated_at:new Date().toISOString()});
    if(f.outPlanner)rows.push({owner_id:Sync.uid,friend_id:f.id,kind:'planner',payload:friendPayload('planner'),updated_at:new Date().toISOString()});
  });
  if(!rows.length)return Promise.resolve();
  FriendSync.busy=true;
  return Promise.all(rows.map(function(row){return sb.from('planner_friend_data').upsert(row,{onConflict:'owner_id,friend_id,kind'});})).then(function(rs){
    var bad=rs.find(function(x){return x.error;});if(bad)throw bad.error;
  }).catch(function(e){FriendSync.error=e&&e.message||'친구 공유 저장에 실패했어요';}).then(function(){FriendSync.busy=false;});

var COLS=['classes','events','todos','routines','exams','allday','trackers','selfchat','ddays'];
var MAPS=['memos','logs','letters','focus','fsess','retro','hourNotes','routineDone'];
function idsOf(st){var o={};COLS.forEach(function(c){o[c]={};(st[c]||[]).forEach(function(x){o[c][x.id]=1;});});return o;}
function mergeState(loc,rem,base){
  var out=JSON.parse(JSON.stringify(loc));
  COLS.forEach(function(c){
    var have={};out[c].forEach(function(x){have[x.id]=1;});
    (rem[c]||[]).forEach(function(x){
      if(have[x.id])return;
      if(base&&base[c]&&base[c][x.id])return;   // 이 기기에서 지운 것
      out[c].push(x);                              // 다른 기기에서 새로 만든 것
    });
    if(base&&base[c]){ // 다른 기기에서 지운 것: base엔 있었는데 원격엔 없음
      var rid={};(rem[c]||[]).forEach(function(x){rid[x.id]=1;});
      out[c]=out[c].filter(function(x){return !(base[c][x.id]&&!rid[x.id]);});
    }
  });
  MAPS.forEach(function(m){var r=rem[m]||{};out[m]=out[m]||{};Object.keys(r).forEach(function(k){if(out[m][k]===undefined)out[m][k]=r[k];});});
  return normalize(out);
}
function applyRemote(st,at){
  /* 원격 반영 전 현재 상태를 보관해, 다른 기기의 빈/옛 데이터로
     시험·일정이 덮여도 되돌릴 수 있게 해요. */
  try{if(S&&hasPlannerData(S)){bkPut('remote',JSON.stringify(S));saveLocalBackupLayers(S);}}catch(e){}
  S=st;S.updatedAt=at;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  var ae=document.activeElement;
  if(!M.type&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();
}
function saveMeta(){lsSet('planner.sync.'+(Sync.uid||'local'),JSON.stringify({lastSeen:Sync.lastSeen||0,base:Sync.base||null}));}
function loadMeta(){Sync.lastSeen=0;Sync.base=null;try{var m=JSON.parse(lsGet('planner.sync.'+(Sync.uid||'local'))||'null');if(m){Sync.lastSeen=m.lastSeen||0;Sync.base=m.base||null;}}catch(e){}}
function reconcile(r){
  var rat=+r.updatedAt||0,rem=normalize(JSON.parse(r.json));
  var localAt=S.updatedAt||0;
  /* 내용이 있는 기기에 데이터 0개인 원격 상태가 들어오면 자동 반영하지 않아요.
     같은 계정의 빈 상태가 먼저 저장된 경우에도 사용자가 직접 선택하게 해요. */
  var localHasData=hasPlannerData(S),remoteHasData=hasPlannerData(rem);
  if(localHasData&&!remoteHasData&&rat!==localAt&&Sync.examGuardAt!==rat){
    Sync.examGuardAt=rat;
    try{bkPut('remote',JSON.stringify(S));}catch(e){}
    if(Sync.kind==='supa')openChoice(r,rat);
    return false;
  }
  var dirty=localAt>0&&(!Sync.lastSeen||localAt>Sync.lastSeen);
  if(!dirty){applyRemote(rem,rat);Sync.lastSeen=rat;Sync.base=idsOf(S);saveMeta();return false;}
  var m=mergeState(S,rem,Sync.lastSeen?Sync.base:null);
  m.updatedAt=Math.max(Date.now(),rat+1);applyRemote(m,m.updatedAt);
  Sync.lastSeen=rat;saveMeta();return true;
}

function push(){
  Sync.timer=null;
  if(!Sync.db)return Promise.resolve();
  if(Sync.busy){Sync.dirty=true;return Promise.resolve();}
  Sync.busy=true;
  var ref=Sync.db.doc(Sync.path);
  return ref.get().then(function(snap){
    if(snap.exists){var r=snap.data()||{};if((+r.updatedAt||0)!==Sync.lastSeen){try{reconcile(r);}catch(e){}}}
    return ref.set({updatedAt:S.updatedAt,json:JSON.stringify(S)}).then(function(){Sync.lastSeen=S.updatedAt;Sync.base=idsOf(S);saveMeta();});
  }).catch(function(){})
    .then(function(){
      Sync.busy=false;
      if(Sync.dirty){Sync.dirty=false;scheduleSync();}
    });
}
function pull(){
  if(!Sync.db)return Promise.resolve();
  return Sync.db.doc(Sync.path).get().then(function(snap){
    var localAt=S.updatedAt||0;
    if(snap.exists){
      var r=snap.data()||{};
      var remoteAt=+r.updatedAt||0;
      if(Sync.kind==='supa'&&lsGet('planner.syncedUser')!==Sync.uid&&localAt>0&&remoteAt!==localAt){
        openChoice(r,remoteAt);return;
      }
      if(Sync.kind==='supa')lsSet('planner.syncedUser',Sync.uid);
      if(remoteAt===Sync.lastSeen){if(localAt>remoteAt)push();return;}
      if(remoteAt===localAt){Sync.lastSeen=remoteAt;Sync.base=idsOf(S);saveMeta();return;}
      try{if(reconcile(r))push();}catch(e){}
    }else{if(Sync.kind==='supa')lsSet('planner.syncedUser',Sync.uid);if(localAt>0)push();}
  }).catch(function(){});
}

function catchUp(){
  if(!F||F.mode==='sw'||F.phase!=='work')return;
  var late=Date.now()-F.endAt;
  if(late>=0){
    var w=FMODES[F.mode][0];addFocus(w);
    if(late>FMODES[F.mode][1]*60000||late>15000){F.phase='idle';F.left=w*60;saveF();drawFocusDone(w,true);F=null;saveF();return;}
  }
}
var FMODES={p25:[25,5],p50:[50,10],sw:[0,0]};
function openFocus(tid){

var RING=2*Math.PI*118;
function fShown(){

  if(F.mode==='sw')return F.phase==='work'?(Date.now()-F.startAt)/1000+F.acc:F.acc;

function viewTodo(){
  var T=new Date(),tk=dkey(T),wk=dkey(mondayOf(T)),mo=mkey(T);
  var allOpen=S.todos.filter(function(t){return !t.done;});
  var dueSoon=allOpen.filter(function(t){return t.due&&diffDays(t.due)<=7;}).sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0;});
  var open=allOpen.filter(function(t){return dueSoon.indexOf(t)<0;});
  function over(t){return (t.scope==='day'&&t.key<tk)||(t.scope==='week'&&t.key<wk)||(t.scope==='month'&&t.key<mo);}
  function fut(t){return (t.scope==='day'&&t.key>tk)||(t.scope==='week'&&t.key>wk)||(t.scope==='month'&&t.key>mo);}
  var groups=[
    ['마감 임박',dueSoon,{tag:true,warn:true,keep:true}],
    ['밀린 할 일',open.filter(over),{tag:true,warn:true}],
    ['오늘',open.filter(function(t){return t.scope==='day'&&t.key===tk;}),{}],
    ['이번 주',open.filter(function(t){return t.scope==='week'&&t.key===wk;}),{}],
    ['이번 달',open.filter(function(t){return t.scope==='month'&&t.key===mo;}),{}],
    ['앞으로',open.filter(fut),{tag:true}],
    ['언제든지',open.filter(function(t){return t.scope==='inbox';}),{}]
  ];
  var qs=[['day','오늘'],['week','이번 주'],['month','이번 달'],['inbox','언제든지']];
  var html='<section class="card"><div class="seg" style="margin-bottom:8px">'+
    qs.map(function(q){return '<button data-act="qscope" data-v="'+q[0]+'" class="'+(U.qscope===q[0]?'on':'')+'">'+q[1]+'</button>';}).join('')+'</div>'+
    '<div class="add" style="margin-top:0"><input data-draft="quick" placeholder="해야 할 일을 적어요" enterkeyhint="done" value="'+esc(U.drafts.quick||'')+'"><button data-act="add-quick">추가</button></div>'+
    (U.qopt?'':'<button class="optlink" data-act="qopt">+ 과목·마감일</button>')+(U.qopt?'<div class="duebox"><span>과목</span>'+courseSelect('q-course',U.qcourse||'','sel')+'</div>':'')+
    (U.qopt?'<div class="duebox"><span>마감일</span><input type="date" id="q-due" value="'+esc(U.qdue||'')+'">'+(U.qdue?'<button data-act="clear-qdue">없음</button>':'')+'</div>':'')+'</section>';
  var any=false;
  groups.forEach(function(g){
    if(!g[1].length)return;
    any=true;
    html+='<section class="card '+(g[2].warn?'warn':'')+'"><div class="card-h"><h3>'+g[0]+'</h3><span class="cnt">'+g[1].length+'</span></div><ul class="todos">'+
      (g[2].keep?g[1]:sortTodos(g[1])).map(function(t){return todoItem(t,{tag:g[2].tag});}).join('')+'</ul></section>';
  });
  if(!any)html+='<div class="empty" style="text-align:center;padding:24px 0">남은 할 일이 없어요</div>';
  html+='<section class="card"><div class="card-h"><h3>반복 할 일</h3><button class="tbtn" data-act="add-rt">+ 추가</button></div>'+
    (S.routines.length?S.routines.map(function(r){
      return '<div class="rt"><span class="ttxt" data-act="edit-rt" data-id="'+r.id+'">'+esc(r.text)+'<small>↻ '+esc(daysText(r.days))+streakTxt(r)+'</small></span></div>';
    }).join(''):'<div class="empty">매일·매주 하는 일을 한 번만 적어두면 일간 화면에 알아서 떠요</div>')+'</section>';
  var done=S.todos.filter(function(t){return t.done;});
  if(done.length){
    html+='<section class="card"><div class="card-h"><h3>완료한 일 '+done.length+'개</h3><button class="tbtn" data-act="toggle-done-list">'+(U.showDone?'접기':'보기')+'</button></div>';
    if(U.showDone){
      html+='<ul class="todos">'+done.slice().sort(function(a,b){return b.created-a.created;}).slice(0,50).map(function(t){return todoItem(t,{tag:true});}).join('')+'</ul>'+
        '<div class="acts"><button class="b-ghost" data-act="clear-done">완료 항목 모두 지우기</button></div>';
    }
    html+='</section>';
  }
  return html;
}

function openCnt(n){return S.todos.filter(function(t){return t.course===n&&!t.done;}).length;}
function pasteDayIndex(text){
  var m=String(text||'').match(/(?:^|[\s\t,|\[\(])(월|화|수|목|금|토|일)(?:요일)?(?=$|[\s\t,|\]\)])/);
  return m?DAYS.indexOf(m[1]):-1;
}
function pasteTimePair(text){
  var range=String(text||'').match(/(\d{1,2})(?::(\d{2}))?\s*(?:시)?\s*(?:~|〜|-|–|—|부터)\s*(\d{1,2})(?::(\d{2}))?\s*(?:시)?/);
  if(range){
    var sm=Number(range[1])*60+Number(range[2]||0),em=Number(range[3])*60+Number(range[4]||0);
    return {start:fmt(sm),end:fmt(em),text:range[0]};
  }
  var xs=[],re=/(\d{1,2}):(\d{2})/g,m;
  while((m=re.exec(String(text||'')))&&xs.length<2)xs.push({m:Number(m[1])*60+Number(m[2]),text:m[0]});
  return xs.length>=2?{start:fmt(xs[0].m),end:fmt(xs[1].m),text:xs[0].text+' '+xs[1].text}:null;
}
function parsePastedClasses(raw){
  var out=[],seen={};
  String(raw||'').split(/\r?\n/).forEach(function(line){
    var src=line.trim();if(!src||/^(시간표|요일|월|화|수|목|금|토|일)\s*(시간|과목|수업)?$/i.test(src))return;
    var day=pasteDayIndex(src),tm=pasteTimePair(src);if(day<0||!tm)return;
    var name=src.replace(tm.text,' ');
    name=name.replace(/(?:^|[\s\t,|\[\(])(월|화|수|목|금|토|일)(?:요일)?(?=$|[\s\t,|\]\)])/g,' ');
    name=name.replace(/[\t|]+/g,' ').replace(/^[\s,;:–—-]+|[\s,;:–—-]+$/g,'').replace(/\s{2,}/g,' ').trim();
    if(!name||name.length>60)return;
    if(tm.end<=tm.start)return;
    var key=name+'|'+day+'|'+tm.start+'|'+tm.end;if(seen[key])return;seen[key]=1;
    out.push({name:name,sub:'',day:day,start:tm.start,end:tm.end,color:defCol()});
  });
  return out;
}

function globalSearchDate(k){
  if(!k)return '';
  try{var d=parseKey(k);return (d.getMonth()+1)+'/'+d.getDate()+' ('+DAYS[dow(d)]+')';}catch(e){return k;}
}
function globalSearchRows(query){
  var q=String(query||'').trim().toLowerCase(),rows=[];
  if(!q)return rows;
  function add(kind,type,id,title,meta,extra,sort){
    var hay=[title,meta,extra].filter(function(x){return x!=null;}).join(' ').toLowerCase();
    if(hay.indexOf(q)<0)return;
    rows.push({kind:kind,type:type,id:String(id),title:String(title||''),meta:String(meta||''),extra:extra||'',sort:String(sort||'9999')});
  }
  S.todos.forEach(function(t){
    var meta=(t.scope==='inbox'?'언제든지':(t.key?tagOf(t):''))+(t.due?' · 마감 '+globalSearchDate(t.due):'')+(t.done?' · 완료':'');
    add('todo','할 일',t.id,t.text,meta,t.course,t.key||t.due||'9999');
  });
  S.routines.forEach(function(r){add('routine','반복 할 일',r.id,r.text,'매주 '+daysText(r.days),'','9999');});
  S.classes.forEach(function(c){add('class','수업',c.id,c.name,(DAYS[c.day]||'')+' · '+(c.start||'')+'–'+(c.end||''),c.sub,'9998');});
  S.events.forEach(function(e){
    var ek=e.date||e.from||'',kind=e.kind==='appointment'?'약속':'일정',meta=(ek?(e.from&&e.to?'기간 '+globalSearchDate(e.from)+' – '+globalSearchDate(e.to):globalSearchDate(ek)):'반복 일정');
    if(e.start)meta+=' · '+timeShort(e.start)+(e.end?'–'+timeShort(e.end):'');
    add('event',kind,e.id,eventLabel(e),meta,eventSub(e),ek||'9997');
  });
  S.allday.forEach(function(a){
    var ak=a.date||a.from||'',meta=a.days?'매주 '+daysText(a.days):(ak?(a.end?'기간 '+globalSearchDate(ak)+' – '+globalSearchDate(a.end):globalSearchDate(ak)):'반복 일정');
    add('allday','종일 일정',a.id,a.title,meta,'','9996');
  });
  S.exams.forEach(function(e){add('exam','시험',e.id,e.name,rangeTxt(e.start,e.end),e.kind||'시험 기간',e.start||'9995');});
  S.ddays.forEach(function(x){add('dday','D-day',x.id,x.title,ddLabel(x),x.date||'','9994');});
  Object.keys(S.memos||{}).forEach(function(k){var m=memoOf(k);if(m&&m.text)add('memo','하루 메모',k,m.text,globalSearchDate(k),'','9993');});
  S.selfchat.forEach(function(m){var text=m.text||'사진';add('chat','채팅',m.id,text,(m.room?chatRoomLabel(m.room)+' · ':'')+globalSearchDate(dkey(new Date(m.at))),m.text||'','9992');});
  var order={todo:0,routine:1,event:2,allday:3,exam:4,dday:5,class:6,memo:7,chat:8};
  rows.sort(function(a,b){return (order[a.kind]-order[b.kind])||a.sort.localeCompare(b.sort);});
  return rows.slice(0,80);
}
function globalSearchResult(r){
  return '<button class="gresult" data-act="global-result" data-kind="'+esc(r.kind)+'" data-id="'+esc(r.id)+'"'+(r.kind==='chat'?' data-room="'+esc((S.selfchat.find(function(m){return String(m.id)===r.id;})||{}).room||'general')+'"':'')+'><span class="gresult-type">'+esc(r.type)+'</span><span class="gresult-main"><b class="gresult-title">'+esc(r.title)+'</b><small class="gresult-meta">'+esc(r.meta)+'</small></span><span class="gresult-arrow">›</span></button>';

function addChatPhotos(files){
  var list=Array.prototype.slice.call(files||[]),left=list.length;
  if(!left)return;
  list.forEach(function(file){
    shrinkImage(file,function(url){
      if(url)U.chatPhotos.push(url);
      left--;
      if(left===0){drawChat();setTimeout(function(){var t=$('#f-chat');if(t)t.focus();},30);}
    });
  });
}
function sendChat(){
  var ta=$('#f-chat');if(!ta)return;var v=ta.value.trim(),photos=(U.chatPhotos||[]).slice();
  if(!v&&!photos.length)return;
  S.selfchat.push({id:uid(),text:v.slice(0,2000),photos:photos,room:U.chatRoom||'general',at:Date.now()});
  U.chatDraft='';U.chatPhotos=[];U.chatSel=null;save();drawChat();
  setTimeout(function(){var t=$('#f-chat');if(t)t.focus();},30);
}

function saveChatRoom(){
  var name=$('#f-chatroom').value.trim();
  if(!name){bad('#f-chatroom');return;}
  var exists=chatRoomData().some(function(r){return r.label===name;});
  if(exists){bad('#f-chatroom');return;}
  var id='room:'+uid();
  S.settings.chatRooms.push({id:id,name:name});
  delete S.settings.chatHidden[id];
  U.chatRoom=id;U.chatQuery='';U.chatSel=null;save();closeModal();drawChat();
}
function saveChatRoomName(){
  var name=$('#f-chatroom-name').value.trim(),room=M.room;
  if(!name||!room||room==='general'){bad('#f-chatroom-name');return;}
  var exists=chatRoomData(true).some(function(r){return r.id!==room&&r.label===name;});
  if(exists){bad('#f-chatroom-name');return;}
  var custom=(S.settings.chatRooms||[]).find(function(r){return r&&r.id===room;});
  if(custom)custom.name=name;
  else S.settings.chatRoomNames[room]=name;
  save();closeModal();drawChat();
}
function leaveChatRoom(){
  var id=U.chatRoom;if(!id||id==='general')return;
  S.settings.chatHidden[id]=true;U.chatRoom='general';U.chatQuery='';U.chatSel=null;save();closeModal();drawChat();
}
function deleteChatRoom(){
  var id=U.chatRoom;if(!id||id==='general')return;
  S.selfchat=S.selfchat.filter(function(m){return (m.room||'general')!==id;});
  var custom=(S.settings.chatRooms||[]).some(function(r){return r.id===id;});
  if(custom)S.settings.chatRooms=(S.settings.chatRooms||[]).filter(function(r){return r.id!==id;});
  else S.settings.chatHidden[id]=true;
  delete S.settings.chatRoomNames[id];U.chatRoom='general';U.chatQuery='';U.chatSel=null;save();closeModal();drawChat();
}
function restoreChatRoom(id){
  if(!id)return;
  var room=chatRoomData(true).find(function(r){return r.id===id;});
  if(!room)return;
  delete S.settings.chatHidden[id];U.chatRoom=id;U.chatQuery='';U.chatSel=null;save();closeModal();drawChat();
}

function ringLabel(r){var d=new Date(r.at||0);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function copyText(txt,box,okMsg){
  var ok=function(){bkMsg(okMsg);};
  var fail=function(){
    /* 클립보드가 막히면 칸에 넣고 선택해서 직접 복사하게 해요 */
    if(box){box.value=txt;box.focus();box.select();try{box.setSelectionRange(0,txt.length);}catch(e){}}
    try{if(document.execCommand('copy')){ok();return;}}catch(e){}
    bkMsg('칸의 글자를 길게 눌러 전체 선택 → 복사해주세요');
  };
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fail);else fail();}catch(e){fail();}
}
function drawBackupSlots(){
  var o=bkOwner();
  var probe=[['prev',['prev'],'undo-backup','방금 복원 전으로 되돌리기'],['logout',bkKeys('logout'),'restore-logout-backup','로그아웃 전 데이터 복원'],['lastGood',bkKeys('lastGood'),'restore-last-good','마지막 정상 상태 복원'],['remote',['remote'],'restore-remote-backup','동기화 전 데이터 복원']];
  Promise.all(probe.map(function(p){return bkFirst(p[1]);})).then(function(recs){
    var box=$('#bk-slots');if(!box||M.type!=='backup')return;
    var html=probe.map(function(p,i){var r=recs[i];if(!r)return '';var n='';try{n=' · '+itemCount(normalize(JSON.parse(r.raw)))+'개';}catch(e){}return '<button class="b-ghost" data-act="'+p[2]+'">'+p[3]+(r.at?' ('+ringLabel(r)+n+')':'')+'</button>';}).join('');
    box.innerHTML=html||'<p class="hint">아직 자동으로 남은 복원 지점이 없어요.</p>';
  });
  bkRingList().then(function(rows){
    var box=$('#bk-ring');if(!box||M.type!=='backup')return;
    rows=rows.filter(function(x){return !o||!x.owner||x.owner===o;}).slice(0,12);
    if(!rows.length){box.innerHTML='';return;}
    box.innerHTML='<p class="lbl" style="margin-top:14px">이 기기 자동 백업 기록</p><div class="snaplist">'+rows.map(function(r){var n='';try{n=' · '+itemCount(normalize(r.data))+'개';}catch(e){}return '<button class="tbtn" data-act="load-ring" data-id="'+r.id+'">'+ringLabel(r)+n+'</button>';}).join('')+'</div><p class="hint">눌러서 칸에 넣은 다음 \'불러오기\'나 \'합치기\'를 눌러요</p>';

}

/* ---------- 액션 ---------- */
function shift(n){
  if(U.tab==='month')U.date=addMonths(U.date,n);
  else if(U.tab==='week')U.date=addDays(U.date,7*n);
  else U.date=addDays(U.date,n);
  render(true);
}
function addTodo(scope,key,text,draftId,due,course){
  text=(text||'').trim();
  if(!text)return;
  S.todos.push({id:uid(),text:text,done:false,star:false,scope:scope,key:key,due:due||null,course:course||'',created:Date.now(),order:Date.now()});
  delete U.drafts[draftId];
  save();U.refocus=draftId;render();
}
function findTodo(id){return S.todos.find(function(t){return t.id===id;});}

function act(a,e){
  var id=a.dataset.id,name=a.dataset.act;
  switch(name){
    case 'tab':U.tab=a.dataset.tab;render(true);break;
    case 'prev':shift(-1);break;
    case 'next':shift(1);break;
    case 'today':U.date=new Date();render(true);break;
    case 'open-day':U.date=parseKey(a.dataset.date);U.tab='day';render(true);break;
    case 'add-event':{
      var now=new Date(),h=(dkey(U.date)===dkey(now))?Math.min(Math.max(now.getHours()+1,9),22):9;
      openEvent(null,{date:dkey(U.date),start:pad(h)+':00',end:pad(h+1)+':00'});break;
    }
    case 'add-schedule':openSchedule(null,{date:a.dataset.date||dkey(U.date)});break;
    case 'add-appointment':{
      openAppointment(null,{date:a.dataset.date});break;
    }
    case 'add-block':openBlock(null,{day:Math.min(dow(U.date),4)});break;
    case 'global-search':openGlobalSearch();break;
    case 'global-result':openGlobalResult(a);break;
    case 'edit-event':{var ev=S.events.find(function(x){return x.id===id;});if(ev)(ev.kind==='appointment'?openAppointment:(ev.kind==='schedule'||ev.days||ev.from?openSchedule:openEvent))(ev);break;}
    case 'edit-block':{var b=S.classes.find(function(x){return x.id===id;});if(b)openBlock(b,null,a.dataset.date);break;}
    case 'toggle-weekend':S.settings.weekend=!S.settings.weekend;save();render();break;
    case 'week-export':exportWeeklyImage();break;
    case 'week-print':printWeekly();break;
    case 'add-at':{var ah=Number(a.dataset.h);openEvent(null,{date:a.dataset.date,start:pad(ah)+':00',end:pad(Math.min(ah+1,23))+':'+(ah>=23?'59':'00')});break;}
    case 'open-login':openLogin();break;
    case 'signup-mode':switchAuthMode(true);break;
    case 'login-mode':switchAuthMode(false);break;
    case 'toggle-password':togglePassword(a.dataset.target,a);break;
    case 'friend-copy-code':friendCopyCode();break;
    case 'friend-add':friendAdd($('#f-friend-code')?$('#f-friend-code').value:'');break;
    case 'friend-pin':toggleFriendPin(id);break;
    case 'friend-view-planner':openFriendPlanner(id);break;
    case 'friend-memories':openFriendMemories(id);break;
    case 'friend-toggle-share':friendToggle(id,a.dataset.mode);break;
    case 'friend-remove':if(armed(a))friendRemove(id);break;
    case 'memory-line':M.line=a.dataset.v;M.station='';drawFriendMemories();break;
    case 'memory-station':M.station=a.dataset.station||'';document.querySelectorAll('.station-grid button').forEach(function(b){b.classList.toggle('on',b.dataset.station===M.station);});break;
    case 'save-friend-memory':saveFriendMemory();break;
    case 'memory-appointment':{var mmDate=$('#f-mdate')?$('#f-mdate').value:'',mmPlace=$('#f-mplace')?$('#f-mplace').value.trim():'',mmWhat=$('#f-mwhat')?$('#f-mwhat').value.trim():'';var memStation=M.station,memFriend=M.friendId;closeModal();openAppointment(null,{date:mmDate||dkey(U.date),place:mmPlace||memStation,what:mmWhat,friendId:memFriend});break;}
    case 'appointment-accept':respondAppointmentRequest(true);break;
    case 'appointment-decline':respondAppointmentRequest(false);break;
    case 'set-topn':S.settings.topN=Number(a.dataset.v);save();render();break;
    case 'toggle-top-show':S.settings.topShow=S.settings.topShow===false;save();render();break;
    case 'top-up':moveTopItem(a.dataset.id,-1);break;
    case 'top-down':moveTopItem(a.dataset.id,1);break;
    case 'set-caldd':S.settings.calDday=a.dataset.v;save();render();break;
    case 'exview':S.settings.examView=a.dataset.v;save();render();break;
    case 'esem':{var dv=Number(a.dataset.v),o=U.esem;if(dv>0){U.esem=o.t===1?{y:o.y,t:2}:{y:o.y+1,t:1};}else{U.esem=o.t===2?{y:o.y,t:1}:{y:o.y-1,t:2};}render();break;}
    case 'rsel':{var sg=a.dataset.g,one=a.dataset.v==='1';document.querySelectorAll('#'+sg+' button').forEach(function(b){b.classList.toggle('on',b===a);});
      var wrap=sg==='f-erange'?$('#f-eew'):$('#f-adew');if(wrap)wrap.style.display=one?'none':'';if(sg==='f-erange')M.single=one;break;}

  if(e.target.id==='set-hs'||e.target.id==='set-he'){var hs=Number($('#set-hs').value),he=Number($('#set-he').value);if(he-hs<3)he=Math.min(24,hs+3);S.settings.hStart=hs;S.settings.hEnd=he;save();render();return;}
  if(e.target.id==='f-bkfile'&&e.target.files&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){var ta=$('#f-backup');if(ta){ta.value=fr.result;bkMsg('파일을 읽었어요. 불러오기를 누르면 전체 데이터가 복원돼요');}};fr.readAsText(e.target.files[0]);return;}
  if(e.target.id==='f-task'&&F){F.tid=e.target.value||null;saveF();return;}
  if(e.target.dataset&&e.target.dataset.letterphoto&&e.target.files&&e.target.files[0]){
    var lk=e.target.dataset.letterphoto;
    shrinkImage(e.target.files[0],function(url){if(url){setLetter(lk,{photo:url,seen:null});save();render();}});
    return;
  }if(e.target.dataset&&e.target.dataset.log)handleLog(e.target);if(e.target.id==='cal-item'){S.settings.calItem=e.target.value;save();}if(e.target.id==='c-due')U.cdue=e.target.value;if(e.target.id==='q-due')U.qdue=e.target.value;if(e.target.id==='q-course')U.qcourse=e.target.value;});
document.addEventListener('dragover',function(e){
  if((e.target.closest&&e.target.closest('#clist'))||(e.target.closest&&e.target.closest('[data-memo-drop]')))e.preventDefault();
},{passive:false});
document.addEventListener('drop',function(e){
  var files=e.dataTransfer&&e.dataTransfer.files;if(!files||!files.length)return;
  var chat=e.target.closest&&e.target.closest('#clist'),memo=e.target.closest&&e.target.closest('[data-memo-drop]');
  if(chat){e.preventDefault();addChatPhotos(files);}
  else if(memo){e.preventDefault();addMemoPhotos(memo.dataset.memoDrop,files);}
});
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)flush();
  else{updateNow();if(F&&M.type==='focus'){catchUp();tickFocus();}if(Sync.db&&!memoTimer&&!Sync.timer&&!Sync.busy)pull();}
});
setInterval(updateNow,60000);
setInterval(tickFocus,500);
setInterval(checkReminders,60000);
setInterval(function(){if(Sync.db&&!document.hidden&&!Sync.busy&&!Sync.timer&&!memoTimer&&!M.type){pull();if(Sync.kind==='supa')friendLoad();}},45000);
setInterval(function(){if(Sync.kind==='supa'&&Sync.uid&&!document.hidden&&!M.type)friendRequestLoad();},12000);

/* ---------- 시작 ---------- */
applyTheme();
carryOver();
setTimeout(enhanceDates,0);
pruneLetters();
render(true);
bkMigrate().then(function(){setTimeout(recoverLocalBackup,60);});
restoreFocus();
initSync();
})();
</script>
</body>
