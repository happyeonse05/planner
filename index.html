<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 플래너</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#3b3530; --sub:#9a9086; --line:#e9e2d6; --soft:#f1ebe0;
  --accent:#d9846a; --accent-ink:#fff; --now:#e5534b; --star:#e2b23c;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171513; --card:#211e1b; --ink:#f0e9df; --sub:#9b9288; --line:#332f2a; --soft:#2b2723;
    --accent:#e59a82; --accent-ink:#2a1a14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171513; --card:#211e1b; --ink:#f0e9df; --sub:#9b9288; --line:#332f2a; --soft:#2b2723;
  --accent:#e59a82; --accent-ink:#2a1a14; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;max-width:920px;margin:0 auto;display:flex;flex-direction:column}
#app.wide{max-width:1180px}
.dayg{display:flex;flex-direction:column-reverse}
.dayg>*{min-width:0}
@media (min-width:760px){
  .dayg{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,34%);gap:12px;align-items:start}
  .side{position:sticky;top:0}
}
.tl{padding:6px 12px}
.tl-h{display:flex;align-items:baseline;gap:8px;margin:8px 2px 6px}
.tl-h b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tl-h span{color:var(--sub);font-size:14px}
.hr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);min-height:58px;align-items:start}
.hr:last-child{border-bottom:0}
.hr .t{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:6px;text-align:left}
.hr.cur{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px}
.hr.cur .t{color:var(--accent);font-weight:700}
.hr .body{display:flex;flex-direction:column;gap:5px;min-width:0}
.hrow{display:flex;flex-wrap:wrap;gap:5px}
.hchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:8px;background:var(--c);color:#fff;font-size:13px;font-weight:600;text-align:left}
.hchip small{font-size:11px;opacity:.9;font-weight:500;white-space:nowrap}
.hchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip.ev{background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink);border-left:3px solid var(--c)}
.hchip.gp{background:transparent;color:var(--sub);border:1.5px dashed color-mix(in srgb,var(--sub) 45%,transparent);font-weight:600}
.hin{width:100%;border:0;background:transparent;padding:6px 0;font-size:15px;min-width:0}
.hin::placeholder{color:var(--sub);opacity:.7}
.hin:focus{outline:none;border-bottom:1px solid var(--accent)}
.donelbl{font-size:12px;color:var(--sub);margin:14px 2px 2px}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--sub);font-size:12px;margin-top:2px;white-space:nowrap}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-size:19px;line-height:1;flex:none;text-align:center}
.tbtn{height:34px;padding:0 12px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:600;flex:none;text-align:center}
.plus{background:var(--ink);color:var(--bg)}
main{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 20px;-webkit-overflow-scrolling:touch}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px 8px;border-top:1px solid var(--line);background:var(--card)}
.nav button{padding:9px 0;border-radius:10px;font-size:13px;color:var(--sub);font-weight:600;text-align:center}
.nav button.on{background:var(--soft);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.card.warn{border-color:color-mix(in srgb,var(--now) 45%,var(--line))}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.note{margin:8px 2px;padding:8px 10px;border-radius:10px;background:var(--soft);color:var(--sub);font-size:12px}
.hint{font-size:12px;color:var(--sub);margin:0 2px 10px;line-height:1.5}

/* month */
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mh span{text-align:center;font-size:12px;color:var(--sub);padding:2px 0 6px}
.mh span:nth-child(6){color:#6b8dc7}
.mh span:nth-child(7){color:#d0705f}
.mg{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:86px;padding:3px 2px;
  display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0;align-items:stretch}
.cell.out{opacity:.38}
.cell .n{font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums;align-self:flex-start}
.cell.we .n{color:#d0705f}
.cell.we:nth-child(7n+6) .n{color:#6b8dc7}
.cell.today .n{background:var(--accent);color:var(--accent-ink);font-weight:700}
.dots{display:flex;gap:2px;flex-wrap:wrap;min-height:5px;padding-left:2px}
.dots i{width:5px;height:5px;border-radius:50%}
.chip{display:block;font-size:9.5px;line-height:1.3;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ev{background:var(--c);color:#fff}
.chip.td{color:var(--sub);background:var(--soft)}
.more{font-size:9.5px;color:var(--sub);padding-left:2px}

/* timetable grid */
.tt-card{padding:8px 4px}
.tt-card .card-h{margin:0 8px 6px}
.tt-head,.tt-body{display:grid;grid-template-columns:28px repeat(var(--n),minmax(0,1fr))}
.tt-head button{padding:2px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.tt-head b{font-size:14px;color:var(--ink);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.tt-head .today b{background:var(--accent);color:var(--accent-ink)}
.tt-body{position:relative}
.tt-hrs{position:relative;height:var(--h)}
.tt-hrs span{position:absolute;right:4px;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.tt-col{position:relative;height:var(--h);border-left:1px solid var(--line);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.tt-col.today{background-color:color-mix(in srgb,var(--accent) 7%,transparent)}
.blk{position:absolute;display:block;border-radius:7px;padding:3px 4px;overflow:hidden;color:#fff;font-size:10.5px;line-height:1.25;
  background:var(--c);text-shadow:0 1px 1px rgba(0,0,0,.18);word-break:break-all;text-align:left}
.blk b{display:block;font-weight:700}
.blk small{display:block;font-size:9.5px;opacity:.92;margin-top:1px}
.blk.ev{background:var(--soft);background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink);text-shadow:none;border-left:3px solid var(--c)}
.tt.day .blk{font-size:13px;padding:6px 9px;border-radius:9px}
.tt.day .blk small{font-size:11px}
.tt.day .tt-body{grid-template-columns:34px minmax(0,1fr)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);font-variant-numeric:tabular-nums}
.slot.c{background:var(--c);color:#fff;font-weight:600}
.dd{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;display:inline-block;background:var(--soft);color:var(--sub);text-decoration:none}
.dd.soon{background:color-mix(in srgb,var(--accent) 20%,var(--card));color:var(--accent)}
.dd.hot{background:var(--now);color:#fff}
.dd.late{background:var(--soft);color:var(--now)}
.rp{font-style:normal;font-size:11px;color:var(--sub);margin-left:6px;white-space:nowrap}
.chip.due{background:transparent;color:var(--now);border:1px solid color-mix(in srgb,var(--now) 50%,transparent);padding:0 3px}
.gap{position:absolute;left:2px;right:2px;border-radius:7px;border:1.5px dashed color-mix(in srgb,var(--sub) 45%,transparent);
  background:color-mix(in srgb,var(--sub) 6%,transparent);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-align:center;line-height:1.2;padding:0 2px}
.tt.day .gap{font-size:12px}
.duebox{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--sub)}
.duebox input{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-size:14px;flex:1;min-width:0}
.duebox button{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--soft);font-weight:600}
.rt{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.rt:last-child{border-bottom:0}
.ctag{font-style:normal;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px 1px 5px;margin-left:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
  max-width:9em;overflow:hidden;text-overflow:ellipsis;vertical-align:1px;background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);text-decoration:none}
.ctag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
select.fld,.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.sel{height:36px;border-radius:10px;border:1px solid var(--line);background-color:var(--bg);padding-left:8px;font-size:14px;flex:1;min-width:0;color:var(--ink)}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:8px 0 0;padding:10px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--now) 10%,var(--card));border:1px solid color-mix(in srgb,var(--now) 30%,var(--line));font-size:14px;font-weight:700}
.exbar small{font-size:12px;color:var(--sub);font-weight:500}
.exbar b{color:var(--ink);font-variant-numeric:tabular-nums}
.cell.exam{background:color-mix(in srgb,var(--now) 8%,transparent)}
.cname{font-weight:700;display:inline-flex;align-items:center;gap:6px;text-align:left}
.cname em{font-style:normal;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0 2px}
.big small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.rt .ttxt small{display:block;color:var(--sub);font-size:12px;margin-top:2px}

/* todos */
.todos{list-style:none;margin:0;padding:0}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700;margin-top:1px;text-align:center}
.todo.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ttxt{flex:1;min-width:0;line-height:1.45;padding-top:1px;word-break:break-word;cursor:pointer}
.todo.done .ttxt{color:var(--sub);text-decoration:line-through}
.tag{font-style:normal;font-size:11px;color:var(--sub);background:var(--soft);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;text-decoration:none;display:inline-block}
.star{flex:none;font-size:18px;color:var(--line);line-height:1;padding:2px;text-align:center}
.star.on{color:var(--star)}
.mini{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--soft);text-align:center}
.empty{color:var(--sub);font-size:13px;padding:8px 2px}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin:0 2px 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.add input:focus{border-color:var(--accent);outline:none}
.add button{height:42px;padding:0 15px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;text-align:center}
.memo{width:100%;min-height:96px;resize:vertical;border:0;border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px;line-height:1.5}
.memo:focus{outline:2px solid var(--accent)}

/* timetable list */
.course{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.course:last-of-type{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px;flex:none}
.course .nm{font-weight:700}
.course .cd{font-size:12px;color:var(--sub);margin-left:6px}
.course .slots{margin-top:7px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow span{font-size:14px}
.setrow small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.monthopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 0 8px}
.monthopt{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.monthopt input{width:17px;height:17px;accent-color:var(--accent);margin:0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(24,18,12,.45);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:20px;padding-bottom:16px}}
.sheet h3{margin:0 0 12px;font-size:17px}
.fld{display:block;width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;margin-bottom:10px}
.fld:focus{border-color:var(--accent);outline:none}
.fld.bad{border-color:var(--now)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.row .fld{margin:0;flex:1;min-width:0}
.lbl{display:block;font-size:12px;color:var(--sub);margin:2px 2px 6px}
.pal{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 14px}
.sw{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{padding:7px 13px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.seg button.on{background:var(--ink);color:var(--bg)}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 2px 14px}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;height:44px;border-radius:12px;font-weight:700;font-size:15px;text-align:center}
.b-save{background:var(--ink);color:var(--bg)}
.b-ghost{background:var(--soft)}
.b-del{background:var(--soft);color:#c9524a;flex:0 0 auto!important;padding:0 16px}
.b-del.armed{background:#c9524a;color:#fff}
.ta{display:block;width:100%;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-bottom:10px;resize:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ===== 테마: 화이트 미니멀 ===== */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1c1c1e; --sub:#8e8e93; --line:#eeeef1; --soft:#f4f4f6;
  --accent:#1c1c1e; --accent-ink:#ffffff; --now:#ff4d4f; --star:#f5b83d; --edge:#e8e8ec; --hi:#f7f7f9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#111113; --ink:#f5f5f7; --sub:#8e8e93; --line:#242427; --soft:#1c1c1f;
    --accent:#f5f5f7; --accent-ink:#000000; --now:#ff6b6b; --edge:#2a2a2e; --hi:#18181b;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#111113; --ink:#f5f5f7; --sub:#8e8e93; --line:#242427; --soft:#1c1c1f;
  --accent:#f5f5f7; --accent-ink:#000000; --now:#ff6b6b; --edge:#2a2a2e; --hi:#18181b;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  background:var(--bg);letter-spacing:-.01em}
h1,h3,.nm,.cname,.big,.tl-h b{font-weight:700;letter-spacing:-.025em}
.top{padding:16px 16px 10px}
.ttl h1{font-size:22px}
.ttl small{font-size:13px}
.ibtn,.tbtn{background:var(--soft);border:0;font-weight:600}
.plus{background:var(--accent);color:var(--accent-ink)}
main{padding:0 14px 24px}
.nav{background:var(--bg);border-top:1px solid var(--line);gap:2px;padding:6px 8px 8px}
.nav button{color:var(--sub);font-weight:600}
.nav button.on{background:transparent;color:var(--ink);font-weight:800}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px;box-shadow:none}
.card-h h3{font-size:16px}
.card.warn{background:var(--card);border-color:color-mix(in srgb,var(--now) 40%,var(--edge))}
.bar{height:4px;border-radius:2px;background:var(--soft)}
.bar i{background:var(--accent)}
.chk{border:1.5px solid #c7c7cc}
.todo.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.todo{border-bottom-color:var(--line)}

<script src="config.js"></script>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var KEY='planner.v1';
var DAYS=['월','화','수','목','금','토','일'];
var PALETTE=['#faefdc','#ebebee','#f8dedd','#fbe3cf','#f8edc4','#dce9f7','#d9efe6','#e3efd6','#e7e1f4'];
var DEFAULT_LINKS=[
  {name:'학교 홈페이지',url:'https://www.skku.edu'},
  {name:'학교 공지사항',url:'https://www.skku.edu/skku/campus/skk_comm/notice01.do'},
  {name:'봉룡학사 식단',url:'https://dorm.skku.edu/dorm_suwon/lifeguide/dorm_restaurant_table.jsp'}
];
var DEFAULT_TRK=[
  {id:'study',name:'공부 시간',type:'dur'},
  {id:'wake',name:'일어난 시간',type:'time'},
  {id:'sstart',name:'공부 시작',type:'time'},
  {id:'send',name:'공부 끝',type:'time'}
];
var BEIGE='#faefdc';
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function addMonths(d,n){
  var t=new Date(d.getFullYear(),d.getMonth()+n,1);
  var dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),dim));
}
function dow(d){return (d.getDay()+6)%7;}            // 월=0 … 일=6
function mondayOf(d){return addDays(d,-dow(d));}
function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1];}
function fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}

/* ---------- 기본 시간표 (스크린샷 기준) ---------- */
var DEFAULT_CLASSES=[];

/* ---------- 상태 & 저장 ---------- */
function defaults(){
  return {
    classes:DEFAULT_CLASSES.map(function(c){return Object.assign({id:uid()},c);}),
    events:[],todos:[],routines:[],exams:[],allday:[],hourNotes:{},logs:{},letters:{},focus:{},retro:{},fsess:{},selfchat:[],ddays:[],trackers:DEFAULT_TRK.map(function(t){return Object.assign({},t);}),routineDone:{},memos:{},settings:{weekend:true,weekV2:true,colorV2:true,logOn:true,calItem:'study',calDday:'star',monthItems:{appointment:true,event:true,dday:true,exam:true,allday:true,todo:true},topOrder:[],links:DEFAULT_LINKS.map(function(l){return {id:uid(),name:l.name,url:l.url};})},updatedAt:0
  };
}
function normalize(s){
  var d=defaults();
  var o=Object.assign(d,s||{});
  o.settings=Object.assign({weekend:false},(s&&s.settings)||{});
  ['classes','events','todos','routines','exams','allday','trackers','selfchat','ddays'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=d[k];});
  if(!o.memos||typeof o.memos!=='object')o.memos={};
  if(!o.routineDone||typeof o.routineDone!=='object')o.routineDone={};
  if(!o.hourNotes||typeof o.hourNotes!=='object')o.hourNotes={};
  if(!o.logs||typeof o.logs!=='object')o.logs={};
  if(!o.letters||typeof o.letters!=='object')o.letters={};
  if(!o.focus||typeof o.focus!=='object')o.focus={};
  if(!o.retro||typeof o.retro!=='object')o.retro={};
  if(!o.fsess||typeof o.fsess!=='object')o.fsess={};
  if(o.settings.letterOn===undefined)o.settings.letterOn=true;
  if(!o.settings.theme&&lsGet('planner.theme'))o.settings.theme=lsGet('planner.theme');
  if(!o.settings.bg&&lsGet('planner.bg'))o.settings.bg=lsGet('planner.bg');
  if(!o.settings.weekV2){o.settings.weekend=true;o.settings.weekV2=true;}
  if(o.settings.logOn===undefined)o.settings.logOn=true;
  if(!o.settings.calItem)o.settings.calItem='study';
  if(!o.settings.calDday)o.settings.calDday='star';
  o.settings.monthItems=Object.assign({appointment:true,event:true,dday:true,exam:true,allday:true,todo:true},o.settings.monthItems||{});
  if(!Array.isArray(o.settings.topOrder))o.settings.topOrder=[];
  if(!Array.isArray(o.settings.links))o.settings.links=DEFAULT_LINKS.map(function(l){return {id:uid(),name:l.name,url:l.url};});
  var OLDB=['#efe7da','#f4e0bf'];
  o.classes.forEach(function(c){if(OLDB.indexOf(c.color)>=0)c.color=BEIGE;});
  o.events.forEach(function(e){if(OLDB.indexOf(e.color)>=0)e.color=BEIGE;});
  o.allday.forEach(function(e){if(OLDB.indexOf(e.color)>=0)e.color=BEIGE;});
  if(!o.settings.colorV2){
    o.classes.forEach(function(c){c.color=BEIGE;});
    o.events.forEach(function(e){if(PALETTE.indexOf(e.color)<0)e.color=PALETTE[5];});
    o.settings.colorV2=true;
  }
  return o;
}
var storageOK=true;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw)return normalize(JSON.parse(raw));
  }catch(e){}
  try{localStorage.setItem('planner.test','1');localStorage.removeItem('planner.test');}catch(e){storageOK=false;}
  return defaults();
}
var S=load();
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}
  scheduleSync();
}

/* ---------- Supabase 설정 (깃허브 배포용) ---------- */
var SUPA_DEFAULT={supabaseUrl:'https://mhxcnmfgemdnfjwmtqlh.supabase.co',supabaseAnonKey:'sb_publishable_PxgP4E_dgBowjQcv0093kw_xePXJh-S'};
var SUPA_CFG=(window.PLANNER_CONFIG&&String(window.PLANNER_CONFIG.supabaseUrl||'').indexOf('https://')===0)?window.PLANNER_CONFIG:SUPA_DEFAULT;
var SUPABASE_URL=SUPA_CFG.supabaseUrl||'';       // config.js에서 읽어요
var SUPABASE_ANON_KEY=SUPA_CFG.supabaseAnonKey||'';
var SUPA_TABLE='planner';

/* ---------- 기기 간 동기화 (사용 가능할 때만) ---------- */
var Sync={db:null,path:null,on:false,busy:false,dirty:false,timer:null,kind:null,sb:null,email:'',uid:null};
function scheduleSync(){
  if(!Sync.db)return;
  clearTimeout(Sync.timer);
  Sync.timer=setTimeout(push,1200);
}
var COLS=['classes','events','todos','routines','exams','allday','trackers','selfchat','ddays'];
var MAPS=['memos','logs','letters','focus','fsess','retro','hourNotes','routineDone'];
function idsOf(st){var o={};COLS.forEach(function(c){o[c]={};(st[c]||[]).forEach(function(x){o[c][x.id]=1;});});return o;}
function mergeState(loc,rem,base){
  var out=JSON.parse(JSON.stringify(loc));
  COLS.forEach(function(c){
    var have={};out[c].forEach(function(x){have[x.id]=1;});
    (rem[c]||[]).forEach(function(x){
      if(have[x.id])return;
      if(base&&base[c]&&base[c][x.id])return;   // 이 기기에서 지운 것
      out[c].push(x);                              // 다른 기기에서 새로 만든 것
    });
    if(base&&base[c]){ // 다른 기기에서 지운 것: base엔 있었는데 원격엔 없음
      var rid={};(rem[c]||[]).forEach(function(x){rid[x.id]=1;});
      out[c]=out[c].filter(function(x){return !(base[c][x.id]&&!rid[x.id]);});
    }
  });
  MAPS.forEach(function(m){var r=rem[m]||{};out[m]=out[m]||{};Object.keys(r).forEach(function(k){if(out[m][k]===undefined)out[m][k]=r[k];});});
  return normalize(out);
}
function applyRemote(st,at){
  S=st;S.updatedAt=at;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  var ae=document.activeElement;
  if(!M.type&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();
}
function saveMeta(){lsSet('planner.sync.'+(Sync.uid||'local'),JSON.stringify({lastSeen:Sync.lastSeen||0,base:Sync.base||null}));}
function loadMeta(){Sync.lastSeen=0;Sync.base=null;try{var m=JSON.parse(lsGet('planner.sync.'+(Sync.uid||'local'))||'null');if(m){Sync.lastSeen=m.lastSeen||0;Sync.base=m.base||null;}}catch(e){}}
function reconcile(r){
  var rat=+r.updatedAt||0,rem=normalize(JSON.parse(r.json));
  var localAt=S.updatedAt||0;
  var dirty=localAt>0&&(!Sync.lastSeen||localAt>Sync.lastSeen);
  if(!dirty){applyRemote(rem,rat);Sync.lastSeen=rat;Sync.base=idsOf(S);saveMeta();return false;}
  var m=mergeState(S,rem,Sync.lastSeen?Sync.base:null);
  m.updatedAt=Math.max(Date.now(),rat+1);applyRemote(m,m.updatedAt);
  Sync.lastSeen=rat;saveMeta();return true;
}
function push(){
  Sync.timer=null;
  if(!Sync.db)return Promise.resolve();
  if(Sync.busy){Sync.dirty=true;return Promise.resolve();}
  Sync.busy=true;
  var ref=Sync.db.doc(Sync.path);
  return ref.get().then(function(snap){
    if(snap.exists){var r=snap.data()||{};if((+r.updatedAt||0)!==Sync.lastSeen){try{reconcile(r);}catch(e){}}}
    return ref.set({updatedAt:S.updatedAt,json:JSON.stringify(S)}).then(function(){Sync.lastSeen=S.updatedAt;Sync.base=idsOf(S);saveMeta();});
  }).catch(function(){})
    .then(function(){
      Sync.busy=false;
      if(Sync.dirty){Sync.dirty=false;scheduleSync();}
    });
}
function pull(){
  if(!Sync.db)return Promise.resolve();
  return Sync.db.doc(Sync.path).get().then(function(snap){
    var localAt=S.updatedAt||0;
    if(snap.exists){
      var r=snap.data()||{};
      var remoteAt=+r.updatedAt||0;
      if(Sync.kind==='supa'&&lsGet('planner.syncedUser')!==Sync.uid&&localAt>0&&remoteAt!==localAt){
        openChoice(r,remoteAt);return;
      }
      if(Sync.kind==='supa')lsSet('planner.syncedUser',Sync.uid);
      if(remoteAt===Sync.lastSeen){if(localAt>remoteAt)push();return;}
      if(remoteAt===localAt){Sync.lastSeen=remoteAt;Sync.base=idsOf(S);saveMeta();return;}
      try{if(reconcile(r))push();}catch(e){}
    }else{if(Sync.kind==='supa')lsSet('planner.syncedUser',Sync.uid);if(localAt>0)push();}
  }).catch(function(){});
}
function applyTheme(){
  var t=(typeof S!=='undefined'&&S.settings&&S.settings.theme)||lsGet('planner.theme')||'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  var bg=(typeof S!=='undefined'&&S.settings&&S.settings.bg)||lsGet('planner.bg')||'plain';
  if(bg==='plain')document.documentElement.removeAttribute('data-bg');
  else document.documentElement.setAttribute('data-bg',bg);
}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function supaReady(){return !!(/^https:\/\/.+/.test(SUPABASE_URL)&&SUPABASE_ANON_KEY.length>20&&window.supabase&&window.supabase.createClient);}
function supaAdapter(sb,uid){
  return {doc:function(){return {
    get:function(){
      return sb.from(SUPA_TABLE).select('json,updated_at').eq('user_id',uid).maybeSingle().then(function(res){
        if(res.error)throw res.error;
        var row=res.data;
        return {exists:!!row,data:function(){return row?{updatedAt:row.updated_at,json:row.json}:undefined;}};
      });
    },
    set:function(v){
      return sb.from(SUPA_TABLE).upsert({user_id:uid,json:v.json,updated_at:v.updatedAt}).then(function(res){if(res.error)throw res.error;});
    }
  };}};
}
function supaAttach(session){
  if(!session||!session.user){
    Sync.db=null;Sync.on=false;Sync.uid=null;Sync.email='';
    if(!M.type)render();return;
  }
  if(Sync.uid===session.user.id)return;
  Sync.uid=session.user.id;Sync.email=session.user.email||'';
  Sync.db=supaAdapter(Sync.sb,Sync.uid);Sync.path='planner';loadMeta();
  pull().then(function(){Sync.on=true;if(!M.type||M.type==='login'){if(M.type==='login')closeModal();render();}});
}
function initSupa(){
  if(!supaReady())return false;

function layout(items){
  var out=[],cluster=[],cEnd=-1;
  function flush(){
    if(!cluster.length)return;
    var lanes=[];
    cluster.forEach(function(it){
      var i=lanes.findIndex(function(end){return end<=it.start;});
      if(i<0){i=lanes.length;lanes.push(it.end);}else lanes[i]=it.end;
      it.lane=i;
    });
    cluster.forEach(function(it){it.lanes=lanes.length;});
    out=out.concat(cluster);cluster=[];
  }
  items.forEach(function(it){

    cluster.push(it);cEnd=Math.max(cEnd,it.end);

  flush();

function sortTodos(a){return a.slice().sort(function(x,y){return (+x.done)-(+y.done)||ordOf(x)-ordOf(y);});}
function keyFor(scope,d){
  return scope==='day'?dkey(d):scope==='week'?dkey(mondayOf(d)):scope==='month'?mkey(d):null;
}
function tagOf(t){
  if(t.scope==='day'){var d=parseKey(t.key);return (d.getMonth()+1)+'/'+d.getDate()+' ('+DAYS[dow(d)]+')';}
  if(t.scope==='week'){var w=parseKey(t.key);return (w.getMonth()+1)+'/'+w.getDate()+' 주';}
  if(t.scope==='month'){return Number(t.key.split('-')[1])+'월';}
  return '언제든지';
}

/* ---------- 화면: 공통 ---------- */
function relLabel(){
  var t=new Date(),n;
  if(U.tab==='month'){n=(U.date.getFullYear()-t.getFullYear())*12+U.date.getMonth()-t.getMonth();return n===0?'이번 달':n>0?n+'달 후':(-n)+'달 전';}
  if(U.tab==='week'){n=Math.round((mondayOf(U.date)-mondayOf(t))/(7*864e5));return n===0?'이번 주':n>0?n+'주 후':(-n)+'주 전';}
  n=diffDays(dkey(U.date));return n===0?'오늘':n>0?n+'일 후':(-n)+'일 전';
}
function topHTML(){
  var d=U.date,t='',s='',arrows=false,plus='';
  var today=dkey(d)===dkey(new Date());
  if(U.tab==='month'){t=d.getFullYear()+'년 '+(d.getMonth()+1)+'월';arrows=true;plus='add-event';}
  else if(U.tab==='week'){
    var m=mondayOf(d),th=addDays(m,3),e=addDays(m,6);
    t=(th.getMonth()+1)+'월 '+Math.ceil(th.getDate()/7)+'주차';
    if(S.settings.semStart&&dkey(addDays(m,6))>=S.settings.semStart&&(!S.settings.semEnd||dkey(m)<=S.settings.semEnd)){var sw=Math.floor((m-mondayOf(parseKey(S.settings.semStart)))/(7*864e5))+1;if(sw>=1)t='개강 '+sw+'주차';}
    s=(m.getMonth()+1)+'/'+m.getDate()+' – '+(e.getMonth()+1)+'/'+e.getDate();
    arrows=true;plus='add-event';
  }else if(U.tab==='day'){
    t=(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DAYS[dow(d)]+')';
    s=(today?'오늘':d.getFullYear()+'년')+(holi(dkey(d))?' · '+holi(dkey(d)):'');
    arrows=true;plus='add-event';
  }else if(U.tab==='todo'){
    var n=S.todos.filter(function(x){return !x.done;}).length;
    t='할 일';s='남은 일 '+n+'개';
  }else if(U.tab==='settings'){
    return '<button class="ibtn" data-act="back" aria-label="뒤로">‹</button><div class="ttl"><h1>설정</h1></div>';
  }else{
    t='시간표';s='매주 반복되는 수업·고정 일정';plus='add-block';
  }
  var jump=(U.tab==='month'||U.tab==='week'||U.tab==='day');
  return '<div class="ttl">'+(jump?'<button class="h1b" data-act="jump" aria-label="날짜로 이동"><h1>'+esc(t)+' <span class="caret">⌄</span></h1></button>':'<h1>'+esc(t)+'</h1>')+(s?'<small>'+esc(s)+'</small>':'')+'</div>'+
    (arrows?'<button class="ibtn" data-act="prev" aria-label="이전">‹</button><button class="tbtn" data-act="today">'+relLabel()+'</button><button class="ibtn" data-act="next" aria-label="다음">›</button>':'')+
    (plus?'<button class="ibtn plus" data-act="'+plus+'" aria-label="추가">+</button>':'')+
    '<button class="ibtn gear" data-act="open-settings" aria-label="설정"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>';
}
function navHTML(){
  var tabs=[['month','월간'],['week','주간'],['day','일간'],['todo','할 일'],['ttable','시간표']];
  return tabs.map(function(t){return '<button data-act="tab" data-tab="'+t[0]+'" class="'+(U.tab===t[0]?'on':'')+'">'+t[1]+'</button>';}).join('');
}

/* ---------- 할 일 컴포넌트 ---------- */
function todoItem(t,o){
  o=o||{};
  return '<li class="todo '+(t.done?'done':'')+'" data-tid="'+t.id+'">'+
    '<button class="chk" data-act="toggle" data-id="'+t.id+'" aria-label="완료 체크">✓</button>'+
    '<span class="ttxt" data-act="edit-todo" data-id="'+t.id+'">'+esc(t.text)+(t.course&&!o.nocourse?'<em class="ctag" style="--c:'+courseColor(t.course)+'">'+esc(t.course)+'</em>':'')+ddHTML(t)+(t.time?'<em class="tag">'+timeShort(t.time)+'</em>':'')+(t.focusMin?'<em class="tag">집중 '+durLong(t.focusMin)+'</em>':'')+(t.carried&&!t.done?'<em class="tag">이월</em>':'')+(o.tag?'<em class="tag">'+esc(tagOf(t))+'</em>':'')+'</span>'+
    (o.move?'<button class="mini" data-act="move-today" data-id="'+t.id+'">오늘로</button>':'')+
    '<button class="star '+(t.star?'on':'')+'" data-act="star" data-id="'+t.id+'" aria-label="중요 표시">★</button>'+
    (o.focus&&!t.done?'<button class="rowfocus" data-act="focus-todo" data-id="'+t.id+'" aria-label="이 일로 집중">'+ICO_CLOCK+'</button>':'')+
    (t.done?'':'<span class="grip" aria-label="끌어서 순서 바꾸기">⋮⋮</span>')+'</li>';
}
function todoBox(scope,key,title){
  var list=sortTodos(S.todos.filter(function(t){return t.scope===scope&&t.key===key;}));
  var rts=scope==='day'?routinesFor(parseKey(key)):[];
  var done=list.filter(function(t){return t.done;}).length+rts.filter(function(r){return routineDone(r,key);}).length;
  var total=list.length+rts.length;
  var id=scope+':'+key;
  var rtHTML=rts.map(function(r){
    var dn=routineDone(r,key);
    return '<li class="todo '+(dn?'done':'')+'"><button class="chk" data-act="toggle-rt" data-id="'+r.id+'" data-date="'+key+'" aria-label="완료 체크">✓</button>'+
      '<span class="ttxt" data-act="edit-rt" data-id="'+r.id+'">'+esc(r.text)+'<em class="rp">↻ '+esc(daysText(r.days))+streakTxt(r)+'</em></span></li>';
  }).join('');
  return '<section class="card"><div class="card-h"><h3>'+esc(title)+'</h3><span class="cnt">'+done+'/'+total+'</span></div>'+
    (total?'<div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>':'')+
    '<ul class="todos">'+((rtHTML+list.map(function(t){return todoItem(t);}).join(''))||'<li class="empty">아직 적은 일이 없어요</li>')+'</ul>'+
    '<div class="add"><input data-draft="'+id+'" data-scope="'+scope+'" data-key="'+key+'" placeholder="할 일 추가" enterkeyhint="done" value="'+esc(U.drafts[id]||'')+'"><button data-act="add">추가</button></div></section>';
}

/* ---------- 시간표 그리드 ---------- */
function hourLabel(h){return ((h+11)%12)+1;}
function gridHTML(dates,o){
  o=o||{};
  var items=dates.map(function(d){return layout(itemsFor(d));});
  var lo=S.settings.hStart!=null?S.settings.hStart:9,hi=S.settings.hEnd!=null?S.settings.hEnd:22;
  items.forEach(function(arr){arr.forEach(function(it){lo=Math.min(lo,Math.floor(it.start/60));hi=Math.max(hi,Math.ceil(it.end/60));});});
  hi=Math.min(hi,24);
  var rows=hi-lo,hh=o.day?56:48;
  var now=new Date(),tk=dkey(now),nowMin=now.getHours()*60+now.getMinutes();
  var hours='';
  for(var i=0;i<rows;i++)hours+='<span style="top:'+(i*hh+3)+'px">'+hourLabel(lo+i)+'</span>';
  var cols=dates.map(function(d,i){
    var k=dkey(d);
    var blocks=items[i].map(function(it){
      var top=(it.start-lo*60)/60*hh,h=Math.max((it.end-it.start)/60*hh-2,18);
      var left='calc('+it.lane+'*100%/'+it.lanes+' + 1px)',w='calc(100%/'+it.lanes+' - 2px)';
      var small='';
      if(o.day||it.appointment)small+='<small>'+fmt(it.start)+(it.openEnd?'':'–'+fmt(it.end))+'</small>';
      if(it.sub)small+='<small>'+esc(it.sub)+'</small>';
      return '<button class="blk '+(it.kind==='event'?'ev':'')+(it.appointment?' appt':'')+(it.skipped?' skipd':'')+'" style="--c:'+it.color+';top:'+top+'px;height:'+h+'px;left:'+left+';width:'+w+'" data-act="'+actOf(it)+'" data-id="'+it.id+'" data-date="'+k+'"><b>'+esc(it.name)+'</b>'+small+'</button>';
    }).join('');
    var gaps=gapsOf(items[i]).map(function(g){
      var top=(g.start-lo*60)/60*hh+1,h=(g.end-g.start)/60*hh-3;
      return '<button class="gap" style="top:'+top+'px;height:'+h+'px" data-act="gap" data-date="'+k+'" data-s="'+fmt(g.start)+'" data-e="'+fmt(g.end)+'" aria-label="공강 '+durText(g.end-g.start)+'">'+(o.day?'공강 '+durText(g.end-g.start):durText(g.end-g.start,true))+'</button>';
    }).join('');
    blocks=gaps+blocks;
    var nl=(k===tk&&nowMin>=lo*60&&nowMin<hi*60)?'<div class="now" data-lo="'+(lo*60)+'" data-hh="'+hh+'" style="top:'+((nowMin-lo*60)/60*hh)+'px"></div>':'';
    return '<div class="tt-col '+(k===tk?'today':'')+'" data-date="'+k+'" data-lo="'+(lo*60)+'" data-hh="'+hh+'">'+blocks+nl+'</div>';
  }).join('');
  var head=o.head?'<div class="tt-head"><span></span>'+dates.map(function(d){
    var k=dkey(d);
    return '<button data-act="open-day" data-date="'+k+'" class="'+(k===tk?'today':'')+'"><span>'+DAYS[dow(d)]+'</span><b'+(holi(k)?' class="holb" title="'+holi(k)+'"':'')+'>'+d.getDate()+'</b></button>';
  }).join('')+'</div>':'';
  var ddDates=dates.some(function(d){return ddOn(dkey(d)).length||examsFor(d).length;});
  var adDates=dates.some(function(d){return alldayFor(d).length;});
  var specials='';
  if(ddDates)specials+='<div class="tt-ad"><span>D-day</span>'+dates.map(function(d){var k=dkey(d);return '<div>'+ddOn(k).map(ddChip).join('')+examsFor(d).map(examChip).join('')+'</div>';}).join('')+'</div>';
  if(adDates)specials+='<div class="tt-ad"><span>종일</span>'+dates.map(function(d){return '<div>'+alldayFor(d).map(adChip).join('')+'</div>';}).join('')+'</div>';
  return '<div class="tt '+(o.day?'day':'')+'" style="--n:'+dates.length+';--hh:'+hh+'px;--h:'+(rows*hh)+'px">'+head+
    '<div class="tt-body"><div class="tt-hrs">'+hours+'</div>'+cols+'</div>'+specials+'</div>';
}
function updateNow(){
  var n=new Date(),m=n.getHours()*60+n.getMinutes();
  document.querySelectorAll('.now').forEach(function(el){
    el.style.top=((m-Number(el.dataset.lo))/60*Number(el.dataset.hh))+'px';
  });
}

/* ---------- 화면: 월간 ---------- */
function viewMonth(){
  var d=U.date,y=d.getFullYear(),m=d.getMonth();
  var first=new Date(y,m,1),off=dow(first),dim=new Date(y,m+1,0).getDate();
  var rows=Math.ceil((off+dim)/7),start=addDays(first,-off),tk=dkey(new Date());
  var cells='';
  for(var i=0;i<rows*7;i++){
    var c=addDays(start,i),k=dkey(c),w=i%7;
    var dots=S.classes.filter(function(x){return x.day===w&&clsActive(x,k);}).slice(0,5).map(function(x){return '<i style="background:'+x.color+'"></i>';}).join('');
    var evs=S.events.filter(function(e){return e.date===k&&((e.kind==='appointment'&&monthItemOn('appointment'))||(e.kind!=='appointment'&&monthItemOn('event')));}).sort(function(a,b){return (a.start||'99:99')<(b.start||'99:99')?-1:1;});
    var tds=monthItemOn('todo')?sortTodos(S.todos.filter(function(t){return t.scope==='day'&&t.key===k;})):[];var tdn=tds.filter(function(t){return t.done;}).length;
    var dues=monthItemOn('todo')?S.todos.filter(function(t){return t.due===k&&!t.done;}):[];
    var ads=monthItemOn('allday')?alldayFor(c):[],exs=monthItemOn('exam')?examsFor(c):[],dds=monthItemOn('dday')?ddOn(k):[],adSummary=ads.length?'<span class="chip ev" style="--c:'+ads[0].color+'">'+esc(ads[0].title)+(ads.length>1?'<b class="admore">+'+(ads.length-1)+'</b>':'')+'</span>':'';
    var chips=dds.map(function(x){return '<span class="chip ev" style="--c:'+x.color+'">'+esc(ddDisplay(x))+' '+esc(x.title)+'</span>';}).concat(dues.map(function(t){return '<span class="chip due">'+esc(t.text)+'</span>';})).concat(adSummary?[adSummary]:[]).concat(evs.map(function(e){return '<span class="chip ev" style="--c:'+e.color+'">'+esc(eventChipLabel(e))+'</span>';}))
      .concat(tds.map(function(t){return '<span class="chip td'+(t.done?' cdone':'')+'">'+esc(t.text)+'</span>';}));
    var shown=chips.slice(0,2).join('')+(chips.length>2?'<span class="more">+'+(chips.length-2)+'</span>':'');
    cells+='<button class="cell '+(c.getMonth()!==m?'out ':'')+(w>=5?'we ':'')+(holi(k)?'hol ':'')+(k===tk?'today ':'')+(exs.length?'exam':'')+'" data-act="open-day" data-date="'+k+'">'+
      '<span class="n"'+(holi(k)?' title="'+holi(k)+'"':'')+'>'+c.getDate()+'</span>'+(holi(k)?'<span class="holn">'+holi(k)+'</span>':'')+(dues.length?'<span class="duemark"></span>':'')+(exs.length?'<span class="exmark" data-act="edit-exam" data-id="'+exs[0].id+'" title="시험 기간">'+examIcon()+'</span>':'')+((evs.length||ads.length)?'<span class="evmark" style="--c:'+((evs[0]||ads[0]).color)+'"></span>':'')+(monthItemOn('dday')?ddMark(k):'')+(tds.length?'<span class="tcnt">'+tdn+'/'+tds.length+'</span>':'')+'<span class="dots">'+dots+'</span>'+calCell(k)+shown+'</button>';
  }
  var sum='';
  if(S.settings.logOn){
    var ci=trk(S.settings.calItem);
    if(ci&&ci.type==='dur'){
      var tot=0,cnt=0,pre=mkey(d);
      Object.keys(S.logs).forEach(function(k){if(k.slice(0,7)===pre&&S.logs[k][ci.id]!==undefined){tot+=S.logs[k][ci.id];cnt++;}});
      if(cnt)sum='<div class="msum">'+esc(ci.name)+' 이번 달 합계 <b>'+durLong(tot)+'</b><span>'+cnt+'일 · 하루 평균 '+durLong(Math.round(tot/cnt))+'</span></div>';
    }
  }
  return '<section class="card">'+sum+'<div class="mh">'+DAYS.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div><div class="mg">'+cells+'</div></section>'+
    todoBox('month',mkey(d),(m+1)+'월 할 일');
}

/* ---------- 화면: 주간 ---------- */
function viewWeek(){
  var mon=mondayOf(U.date),n=S.settings.weekend?7:5;
  var dates=[];for(var i=0;i<n;i++)dates.push(addDays(mon,i));
  var wk0=dkey(mon),wk6=dkey(addDays(mon,n-1)),un=S.classes.filter(function(c){return c.day==null;}),unA=S.events.filter(function(e){return e.kind==='appointment'&&!e.start&&e.date>=wk0&&e.date<=wk6;});
  return '<section class="card tt-card"><div class="card-h"><h3>시간표</h3><button class="tbtn" data-act="toggle-weekend">'+(S.settings.weekend?'주말 숨기기':'주말 보기')+'</button></div>'+
    gridHTML(dates,{head:true})+'</section>'+
    (un.length?'<section class="card"><div class="card-h"><h3>시간 미정 수업</h3></div><div class="slots">'+
      un.map(function(c){return '<button class="slot c" style="--c:'+c.color+'" data-act="edit-block" data-id="'+c.id+'">'+esc(c.name)+'</button>';}).join('')+'</div></section>':'')+
    (unA.length?'<section class="card"><div class="card-h"><h3>시간 미정 약속</h3></div><div class="slots">'+
      unA.map(function(a){return '<button class="slot c" style="--c:'+a.color+'" data-act="edit-event" data-id="'+a.id+'">'+esc(eventChipLabel(a))+'</button>';}).join('')+'</div></section>':'')+
    todoBox('week',dkey(mon),'이번 주 할 일')+reviewHTML(mon);
}
function reviewHTML(mon){
  var thisMon=mondayOf(new Date()),today=dkey(new Date());
  if(dkey(mon)>dkey(thisMon))return '';
  var sun=addDays(mon,6),mk=dkey(mon),sk=dkey(sun);
  var list=S.todos.filter(function(t){return (t.scope==='week'&&t.key===mk)||(t.scope==='day'&&t.key>=mk&&t.key<=sk);});
  var rTot=0,rDone=0;
  for(var i=0;i<7;i++){var dd=addDays(mon,i),k=dkey(dd);if(k>today)break;routinesFor(dd).forEach(function(r){rTot++;if(routineDone(r,k))rDone++;});}
  var tot=list.length+rTot,dn=list.filter(function(t){return t.done;}).length+rDone;
  if(!tot)return '';
  var left=sortTodos(list.filter(function(t){return !t.done;}));
  var pct=Math.round(dn/tot*100);
  return '<section class="card"><div class="card-h"><h3>'+(dkey(mon)===dkey(thisMon)?'이번 주 돌아보기':'이 주 돌아보기')+'</h3><span class="cnt">반복 포함 '+dn+'/'+tot+'</span></div>'+
    '<div class="big">'+pct+'%<small>완료</small></div><div class="bar" style="margin:8px 2px 10px"><i style="width:'+pct+'%"></i></div>'+
    (left.length?'<ul class="todos">'+left.map(function(t){return todoItem(t,{tag:true});}).join('')+'</ul>'+
      '<div class="acts"><button class="b-save" data-act="carry-over" data-mon="'+mk+'">못 한 일 '+left.length+'개 다음 주로 넘기기</button></div>'
      :'<div class="empty">이 주에 적은 일은 다 끝냈어요</div>')+'</section>';
}

/* ---------- 화면: 일간 ---------- */
function sideTodo(k,title){
  var list=S.todos.filter(function(t){return t.scope==='day'&&t.key===k;});
  var rts=routinesFor(parseKey(k));
  var openT=sortTodos(list.filter(function(t){return !t.done;})),doneT=sortTodos(list.filter(function(t){return t.done;}));
  var openR=rts.filter(function(r){return !routineDone(r,k);}),doneR=rts.filter(function(r){return routineDone(r,k);});
  function rtLi(r,dn){
    return '<li class="todo '+(dn?'done':'')+'"><button class="chk" data-act="toggle-rt" data-id="'+r.id+'" data-date="'+k+'" aria-label="완료 체크">✓</button>'+
      '<span class="ttxt" data-act="edit-rt" data-id="'+r.id+'">'+esc(r.text)+'<em class="rp">↻ '+esc(daysText(r.days))+streakTxt(r)+'</em></span></li>';
  }
  var nOpen=openT.length+openR.length,nDone=doneT.length+doneR.length,tot=nOpen+nDone,id='day:'+k;
  return '<section class="card"><div class="card-h"><h3>'+esc(title)+'</h3><span class="cnt">'+nOpen+' 남음 · '+nDone+' 완료</span></div>'+
    (tot?'<div class="bar"><i style="width:'+Math.round(nDone/tot*100)+'%"></i></div>':'')+
    '<div class="add" style="margin:4px 0 6px"><input data-draft="'+id+'" data-scope="day" data-key="'+k+'" placeholder="새 할 일 추가" enterkeyhint="done" value="'+esc(U.drafts[id]||'')+'"><button data-act="add">추가</button></div>'+
    '<ul class="todos">'+((openR.map(function(r){return rtLi(r,false);}).join('')+openT.map(function(t){return todoItem(t,{focus:k===todayKey()});}).join(''))||'<li class="empty">'+(nDone?'다 끝냈어요':'아직 적은 일이 없어요')+'</li>')+'</ul>'+
    (nDone?'<div class="donelbl">완료됨</div><ul class="todos">'+doneR.map(function(r){return rtLi(r,true);}).join('')+doneT.map(function(t){return todoItem(t);}).join('')+'</ul>':'')+
    '</section>';
}
function timelineHTML(d){
  var k=dkey(d),items=itemsFor(d),gaps=[];
  var lo=S.settings.hStart!=null?S.settings.hStart:6,hi=S.settings.hEnd!=null?S.settings.hEnd:23;
  items.forEach(function(it){lo=Math.min(lo,Math.floor(it.start/60));hi=Math.max(hi,Math.ceil(it.end/60));});
  hi=Math.min(hi,24);
  var now=new Date(),isToday=k===dkey(now),nh=now.getHours();
  var notes=S.hourNotes[k]||{},rows='';
  for(var h=lo;h<hi;h++){
    var hs=h*60,he=hs+60;
    var inH=items.filter(function(it){return it.start<he&&it.end>hs;});
    var chips=inH.map(function(it){
      var first=it.start>=hs;
      var tm=timeShort(fmt(Math.max(it.start,hs)))+(it.openEnd?'':'~'+timeShort(fmt(Math.min(it.end,he))));
      return '<button class="hchip '+(it.kind==='event'?'ev':'')+(it.appointment?' appt':'')+(it.skipped?' skipd':'')+(it.done?' tdone':'')+'" style="--c:'+it.color+'" data-act="'+actOf(it)+'" data-id="'+it.id+'" data-date="'+k+'"><span>'+esc(it.name)+'</span>'+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'<small>'+tm+'</small></button>';
    });
    gaps.forEach(function(g){
      if(g.start<he&&g.end>hs&&g.start>=hs)chips.push('<button class="hchip gp" data-act="gap" data-date="'+k+'" data-s="'+fmt(g.start)+'" data-e="'+fmt(g.end)+'">공강 '+esc(durText(g.end-g.start))+'</button>');
    });
    rows+='<div class="hr'+(isToday&&h===nh?' cur':'')+'" id="hr-'+h+'">'+
      '<button class="t" data-act="add-at" data-date="'+k+'" data-h="'+h+'" aria-label="'+h+'시 일정 추가">'+h+':00</button>'+
      '<div class="body">'+(chips.length?'<div class="hrow">'+chips.join('')+'</div>':'')+
      '<input class="hin" data-hnote="'+k+'|'+h+'" placeholder="메모" value="'+esc(notes[h]||'')+'"></div></div>';

}

function viewTodo(){
  var T=new Date(),tk=dkey(T),wk=dkey(mondayOf(T)),mo=mkey(T);
  var allOpen=S.todos.filter(function(t){return !t.done;});
  var dueSoon=allOpen.filter(function(t){return t.due&&diffDays(t.due)<=7;}).sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0;});
  var open=allOpen.filter(function(t){return dueSoon.indexOf(t)<0;});
  function over(t){return (t.scope==='day'&&t.key<tk)||(t.scope==='week'&&t.key<wk)||(t.scope==='month'&&t.key<mo);}
  function fut(t){return (t.scope==='day'&&t.key>tk)||(t.scope==='week'&&t.key>wk)||(t.scope==='month'&&t.key>mo);}
  var groups=[
    ['마감 임박',dueSoon,{tag:true,warn:true,keep:true}],
    ['밀린 할 일',open.filter(over),{tag:true,warn:true}],
    ['오늘',open.filter(function(t){return t.scope==='day'&&t.key===tk;}),{}],
    ['이번 주',open.filter(function(t){return t.scope==='week'&&t.key===wk;}),{}],
    ['이번 달',open.filter(function(t){return t.scope==='month'&&t.key===mo;}),{}],
    ['앞으로',open.filter(fut),{tag:true}],
    ['언제든지',open.filter(function(t){return t.scope==='inbox';}),{}]
  ];
  var qs=[['day','오늘'],['week','이번 주'],['month','이번 달'],['inbox','언제든지']];
  var html='<section class="card"><div class="seg" style="margin-bottom:8px">'+
    qs.map(function(q){return '<button data-act="qscope" data-v="'+q[0]+'" class="'+(U.qscope===q[0]?'on':'')+'">'+q[1]+'</button>';}).join('')+'</div>'+
    '<div class="add" style="margin-top:0"><input data-draft="quick" placeholder="해야 할 일을 적어요" enterkeyhint="done" value="'+esc(U.drafts.quick||'')+'"><button data-act="add-quick">추가</button></div>'+
    (U.qopt?'':'<button class="optlink" data-act="qopt">+ 과목·마감일</button>')+(U.qopt?'<div class="duebox"><span>과목</span>'+courseSelect('q-course',U.qcourse||'','sel')+'</div>':'')+
    (U.qopt?'<div class="duebox"><span>마감일</span><input type="date" id="q-due" value="'+esc(U.qdue||'')+'">'+(U.qdue?'<button data-act="clear-qdue">없음</button>':'')+'</div>':'')+'</section>';
  var any=false;
  groups.forEach(function(g){
    if(!g[1].length)return;
    any=true;
    html+='<section class="card '+(g[2].warn?'warn':'')+'"><div class="card-h"><h3>'+g[0]+'</h3><span class="cnt">'+g[1].length+'</span></div><ul class="todos">'+
      (g[2].keep?g[1]:sortTodos(g[1])).map(function(t){return todoItem(t,{tag:g[2].tag});}).join('')+'</ul></section>';
  });
  if(!any)html+='<div class="empty" style="text-align:center;padding:24px 0">남은 할 일이 없어요</div>';
  html+='<section class="card"><div class="card-h"><h3>반복 할 일</h3><button class="tbtn" data-act="add-rt">+ 추가</button></div>'+
    (S.routines.length?S.routines.map(function(r){
      return '<div class="rt"><span class="ttxt" data-act="edit-rt" data-id="'+r.id+'">'+esc(r.text)+'<small>↻ '+esc(daysText(r.days))+streakTxt(r)+'</small></span></div>';
    }).join(''):'<div class="empty">매일·매주 하는 일을 한 번만 적어두면 일간 화면에 알아서 떠요</div>')+'</section>';
  var done=S.todos.filter(function(t){return t.done;});
  if(done.length){
    html+='<section class="card"><div class="card-h"><h3>완료한 일 '+done.length+'개</h3><button class="tbtn" data-act="toggle-done-list">'+(U.showDone?'접기':'보기')+'</button></div>';
    if(U.showDone){
      html+='<ul class="todos">'+done.slice().sort(function(a,b){return b.created-a.created;}).slice(0,50).map(function(t){return todoItem(t,{tag:true});}).join('')+'</ul>'+
        '<div class="acts"><button class="b-ghost" data-act="clear-done">완료 항목 모두 지우기</button></div>';
    }
    html+='</section>';
  }
  return html;
}

function shift(n){

}

function act(a,e){
  var id=a.dataset.id,name=a.dataset.act;
  switch(name){
    case 'tab':U.tab=a.dataset.tab;render(true);break;
    case 'prev':shift(-1);break;
    case 'next':shift(1);break;
    case 'today':U.date=new Date();render(true);break;
    case 'open-day':U.date=parseKey(a.dataset.date);U.tab='day';render(true);break;
    case 'add-event':{
      var now=new Date(),h=(dkey(U.date)===dkey(now))?Math.min(Math.max(now.getHours()+1,9),22):9;
      openEvent(null,{date:dkey(U.date),start:pad(h)+':00',end:pad(h+1)+':00'});break;
    }
    case 'add-appointment':{
      openAppointment(null,{date:a.dataset.date});break;
    }
    case 'add-block':openBlock(null,{day:Math.min(dow(U.date),4)});break;
    case 'edit-event':{var ev=S.events.find(function(x){return x.id===id;});if(ev)(ev.kind==='appointment'?openAppointment:openEvent)(ev);break;}
    case 'edit-block':{var b=S.classes.find(function(x){return x.id===id;});if(b)openBlock(b,null,a.dataset.date);break;}
    case 'toggle-weekend':S.settings.weekend=!S.settings.weekend;save();render();break;
    case 'add-at':{var ah=Number(a.dataset.h);openEvent(null,{date:a.dataset.date,start:pad(ah)+':00',end:pad(Math.min(ah+1,23))+':'+(ah>=23?'59':'00')});break;}
    case 'open-login':openLogin();break;
    case 'set-topn':S.settings.topN=Number(a.dataset.v);save();render();break;
    case 'top-up':moveTopItem(a.dataset.id,-1);break;
    case 'top-down':moveTopItem(a.dataset.id,1);break;
    case 'set-caldd':S.settings.calDday=a.dataset.v;save();render();break;

  }

    '<div class="dpw"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>'+
    '<div class="dpg">'+cells+'</div>'+

  if(e.target.id==='f-chat'&&!e.shiftKey){e.preventDefault();sendChat();return;}
  var t=e.target;
  if(t.closest&&t.closest('.add')&&t.tagName==='INPUT'){
    e.preventDefault();
    var btn=t.parentElement.querySelector('button[data-act]');
    if(btn)btn.click();
  }else if(t.tagName==='INPUT'&&M.type){
    var sv={dd:'save-dd',jump:'do-jump',trk:'save-trk',link:'save-link',login:'login',event:'save-event',appointment:'save-appointment',block:'save-block',todo:'save-todo',routine:'save-rt',exam:'save-exam',allday:'save-ad'}[M.type];
    var b=sv&&document.querySelector('[data-act="'+sv+'"]');
    if(b&&t.type!=='time'&&t.type!=='date'){e.preventDefault();b.click();}
  }
});
var memoTimer=null;
function handleLog(t){
  var p=t.dataset.log.split('|'),k=p[0],id=p[1],f=p[2];
  if(f==='t'){setLog(k,id,t.value||undefined);}
  else{
    var hi=document.querySelector('[data-log="'+k+'|'+id+'|h"]'),mi=document.querySelector('[data-log="'+k+'|'+id+'|m"]');
    var hv=hi&&hi.value!==''?Math.max(0,parseInt(hi.value,10)||0):null,mv=mi&&mi.value!==''?Math.max(0,parseInt(mi.value,10)||0):null;
    if(hv===null&&mv===null)setLog(k,id,undefined);else setLog(k,id,Math.min((hv||0)*60+(mv||0),1440));
  }
  clearTimeout(memoTimer);memoTimer=setTimeout(function(){memoTimer=null;save();},400);
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('bad'))t.classList.remove('bad');
  if(t.dataset&&t.dataset.draft)U.drafts[t.dataset.draft]=t.value;
  if(t.id==='q-due'){U.qdue=t.value;}
  if(t.id==='c-due'){U.cdue=t.value;}
  if(t.id==='f-chat'){U.chatDraft=t.value;}
  if(t.dataset&&t.dataset.log)handleLog(t);
  if(t.dataset&&t.dataset.retro){if(t.value)S.retro[t.dataset.retro]=t.value;else delete S.retro[t.dataset.retro];clearTimeout(memoTimer);memoTimer=setTimeout(function(){memoTimer=null;save();},400);}
  if(t.dataset&&t.dataset.letter){setLetter(t.dataset.letter,{text:t.value.trim()?t.value:null,seen:null});clearTimeout(memoTimer);memoTimer=setTimeout(function(){memoTimer=null;save();},500);}
  if(t.dataset&&t.dataset.hnote){
    var hp=t.dataset.hnote.split('|'),hk=hp[0],hh=hp[1];
    var o=S.hourNotes[hk]||{};
    if(t.value)o[hh]=t.value;else delete o[hh];
    if(Object.keys(o).length)S.hourNotes[hk]=o;else delete S.hourNotes[hk];
    clearTimeout(memoTimer);memoTimer=setTimeout(function(){memoTimer=null;save();},400);
  }
  if(t.dataset&&t.dataset.memo){
    var k=t.dataset.memo;
    if(t.value)S.memos[k]=t.value;else delete S.memos[k];
    clearTimeout(memoTimer);memoTimer=setTimeout(function(){memoTimer=null;save();},400);
  }
});
function flush(){if(memoTimer){clearTimeout(memoTimer);memoTimer=null;save();}}
document.addEventListener('change',function(e){
  if(e.target.dataset&&e.target.dataset.monthItem){S.settings.monthItems[e.target.dataset.monthItem]=e.target.checked;save();render();return;}
  if(M.type==='event'&&/^f-(date|start|end)$/.test(e.target.id)){M.tpA=null;drawTpick();}
  if(e.target.id==='set-ss'||e.target.id==='set-se'){var a1=$('#set-ss').value||null,b1=$('#set-se').value||null;if(a1&&b1&&b1<a1){e.target.classList.add('bad');return;}S.settings.semStart=a1;S.settings.semEnd=b1;save();render();return;}
  if(M.type==='dd'&&/^f-dd[dyo]$/.test(e.target.id)){drawDD();}
  if(e.target.id==='set-hs'||e.target.id==='set-he'){var hs=Number($('#set-hs').value),he=Number($('#set-he').value);if(he-hs<3)he=Math.min(24,hs+3);S.settings.hStart=hs;S.settings.hEnd=he;save();render();return;}
  if(e.target.id==='f-bkfile'&&e.target.files&&e.target.files[0]){var fr=new FileReader();fr.onload=function(){var ta=$('#f-backup');if(ta){ta.value=fr.result;bkMsg('파일을 읽었어요. 불러오기를 두 번 누르면 바뀌어요');}};fr.readAsText(e.target.files[0]);return;}
  if(e.target.id==='f-task'&&F){F.tid=e.target.value||null;saveF();return;}
  if(e.target.dataset&&e.target.dataset.letterphoto&&e.target.files&&e.target.files[0]){
    var lk=e.target.dataset.letterphoto;
    shrinkImage(e.target.files[0],function(url){if(url){setLetter(lk,{photo:url,seen:null});save();render();}});
    return;
  }if(e.target.dataset&&e.target.dataset.log)handleLog(e.target);if(e.target.id==='cal-item'){S.settings.calItem=e.target.value;save();}if(e.target.id==='c-due')U.cdue=e.target.value;if(e.target.id==='q-due')U.qdue=e.target.value;if(e.target.id==='q-course')U.qcourse=e.target.value;});
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)flush();
  else{updateNow();if(F&&M.type==='focus'){catchUp();tickFocus();}if(Sync.db&&!memoTimer&&!Sync.timer&&!Sync.busy)pull();}
});
setInterval(updateNow,60000);
setInterval(tickFocus,500);
setInterval(function(){if(Sync.db&&!document.hidden&&!Sync.busy&&!Sync.timer&&!memoTimer&&!M.type)pull();},45000);

/* ---------- 시작 ---------- */
applyTheme();
carryOver();
setTimeout(enhanceDates,0);
pruneLetters();
render(true);
restoreFocus();
initSync();
})();
</script>
</body>
</html>
