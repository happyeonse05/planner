<script>
/* 에러 표시기: 화면 아래 빨간 박스로 JS 에러를 보여줌 (고친 뒤 지워도 됨) */
(function(){
  var list=[];
  function show(msg){
    list.push(msg);
    var box=document.getElementById('__errbox');
    if(!box){
      box=document.createElement('div');
      box.id='__errbox';
      box.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:99999;max-height:40vh;overflow:auto;background:#d32f2f;color:#fff;font:12px/1.4 monospace;padding:10px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;box-shadow:0 4px 16px rgba(0,0,0,.3)';
      box.title='탭하면 닫힘';
      box.onclick=function(){box.remove();};
      (document.body||document.documentElement).appendChild(box);
    }
    box.textContent='⚠ 에러 '+list.length+'개 (탭하면 닫힘)\n\n'+list.join('\n\n');
  }
  window.addEventListener('error',function(e){
    if(e.target&&e.target!==window&&(e.target.src||e.target.href)){
      show('파일 로드 실패: '+(e.target.src||e.target.href));return;
    }
    var f=(e.filename||'').split('/').pop().split('?')[0];
    show(e.message+'\n→ '+f+' '+e.lineno+':'+e.colno);
  },true);
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;show('Promise: '+(r&&r.stack?r.stack.split('\n').slice(0,2).join('\n'):r));
  });
})();
</script>

<script>
/* 빈 화면 표정(얼굴) 숨기기: 안내 문구만 남김 */
(function(){
  var MSG=/없어요|없습니다|비어\s?있어요/;
  function clean(root){
    var w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);
    var n;while((n=w.nextNode())){
      var t=n.nodeValue.trim();
      if(!t||t.length>40||!MSG.test(t))continue;
      var el=n.parentElement;if(!el)continue;
      var box=el.parentElement;if(!box)continue;
      for(var i=0;i<box.children.length;i++){
        var c=box.children[i];
        if(c===el||c.contains(el))continue;
        if(c.matches('input,textarea,button,select')||c.querySelector('input,textarea,button,select'))continue;
        if(c.textContent.replace(/[\s\-_\.·ㅡ]/g,'')==='')c.style.display='none';
      }
    }
  }
  function run(){clean(document.body);}
  document.addEventListener('DOMContentLoaded',function(){
    run();
    var q=false;
    new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;run();});})
      .observe(document.body,{childList:true,subtree:true});
  });
})();
</script>
