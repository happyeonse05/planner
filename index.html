<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#3b3530; --sub:#9a9086; --line:#e9e2d6; --soft:#f1ebe0;
  --accent:#d9846a; --accent-ink:#fff; --now:#e5534b; --star:#e2b23c;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171513; --card:#211e1b; --ink:#f0e9df; --sub:#9b9288; --line:#332f2a; --soft:#2b2723;
    --accent:#e59a82; --accent-ink:#2a1a14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171513; --card:#211e1b; --ink:#f0e9df; --sub:#9b9288; --line:#332f2a; --soft:#2b2723;
  --accent:#e59a82; --accent-ink:#2a1a14; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:15px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;max-width:920px;margin:0 auto;display:flex;flex-direction:column}
#app.wide{max-width:1180px}
.dayg{display:flex;flex-direction:column-reverse}
.dayg>*{min-width:0}
@media (min-width:760px){
  .dayg{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,34%);gap:12px;align-items:start}
  .side{position:sticky;top:0}
}
.tl{padding:6px 12px}
.tl-h b{white-space:nowrap}
.tl-h{display:flex;align-items:baseline;gap:8px;margin:8px 2px 6px}
.tl-h b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tl-h span{color:var(--sub);font-size:14px}
.hr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);min-height:58px;align-items:start}
.hr:last-child{border-bottom:0}
.hr .t{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:6px;text-align:left}
.hr.cur{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px}
.hr.cur .t{color:var(--accent);font-weight:700}
.hr .body{display:flex;flex-direction:column;gap:5px;min-width:0}
.hrow{display:flex;flex-wrap:wrap;gap:5px}
.hchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:8px;background:var(--c);color:#fff;font-size:13px;font-weight:600;text-align:left}
.hchip small{font-size:11px;opacity:.9;font-weight:500;white-space:nowrap}
.hchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip.ev{background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink);border-left:3px solid var(--c)}
.hchip.gp{background:transparent;color:var(--sub);border:1.5px dashed color-mix(in srgb,var(--sub) 45%,transparent);font-weight:600}
.hin{width:100%;border:0;background:transparent;padding:6px 0;font-size:15px;min-width:0}
.hin::placeholder{color:var(--sub);opacity:.7}
.hin:focus{outline:none;border-bottom:1px solid var(--accent)}
.donelbl{font-size:12px;color:var(--sub);margin:14px 2px 2px}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--sub);font-size:12px;margin-top:2px;white-space:nowrap}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-size:19px;line-height:1;flex:none;text-align:center}
.tbtn{height:34px;padding:0 12px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:600;flex:none;text-align:center}
.plus{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}
main{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 20px;-webkit-overflow-scrolling:touch}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px 8px 8px;border-top:1px solid var(--line);background:var(--card)}
.nav button{padding:9px 0;border-radius:10px;font-size:13px;color:var(--sub);font-weight:600;text-align:center}
.nav button.on{background:var(--soft);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.friendrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.friendrow>div:first-child{min-width:0}.friendrow b,.friendrow small{display:block}.friendrow small{font-size:12px;color:var(--sub);margin-top:3px}.friendacts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.friendacts .tbtn{height:30px;padding:0 8px;font-size:11px}.friendacts .tbtn.on{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}.friend-plan{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.friend-plan small{color:var(--sub)}
.friend-plan-day{padding:10px 0;border-top:1px solid var(--line)}.friend-plan-day>b{display:block;margin-bottom:6px;font-size:14px}.friend-plan-item{display:flex;justify-content:space-between;gap:10px;padding:5px 8px;border-radius:8px;background:var(--soft);margin-top:4px;font-size:13px}.friend-plan-item small{color:var(--sub);white-space:nowrap}
.memory-lines{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}.memory-lines button,.station-grid button{height:32px;padding:0 9px;border-radius:9px;background:var(--soft);font-size:12px;font-weight:700}.memory-lines button.on,.station-grid button.on{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}.station-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;max-height:210px;overflow:auto;margin-bottom:12px}.station-grid button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memory-card{padding:10px;border-radius:12px;background:var(--soft);margin:7px 0}.memory-card b,.memory-card small{display:block}.memory-card small{color:var(--sub);margin-top:4px;line-height:1.45}.memory-empty{padding:14px 0;color:var(--sub);font-size:13px}
.place-search{display:flex;gap:7px;margin:8px 0}.place-search .fld{margin:0}.place-results{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 12px}.place-result{padding:7px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700}.place-result.on{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}
.memory-banners{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:6px 0 12px;padding-bottom:2px}.memory-banners::-webkit-scrollbar{display:none}.memory-banner{flex:none;max-width:230px;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 18%,var(--edge));font-size:12px;line-height:1.35}.memory-banner b{display:block;font-size:13px;margin-bottom:2px}.meet-history{padding:10px 12px;border-radius:14px;background:var(--soft);font-size:13px;margin:0 0 12px}.meet-history b{font-size:14px}.place-mode{display:flex;gap:6px;margin:0 0 8px}.place-mode button{padding:7px 11px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700}.place-mode button.on{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}
.postmeet{margin:10px 0;padding:13px 14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid var(--edge)}.postmeet b{display:block;font-size:14px}.postmeet small{display:block;color:var(--sub);margin:4px 0 10px}.postmeet .acts{margin:0}.postmeet .acts button{height:38px;font-size:13px}.pwrow{display:flex;align-items:center;gap:6px;margin:8px 0}.pwrow .fld{margin:0;flex:1}.pw-eye{width:42px;height:42px;border-radius:11px;background:var(--soft);display:grid;place-items:center}.pw-eye svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.fav img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}.profile-photo-row{display:flex;align-items:center;gap:12px;margin:6px 0 12px}.profile-photo{width:64px;height:64px;border-radius:50%;background:var(--soft);overflow:hidden;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}.profile-photo img{width:100%;height:100%;object-fit:cover}.profile-photo-actions{display:flex;gap:6px;flex-wrap:wrap}.region-path{padding:9px 11px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--sub);margin:0 0 10px}.region-path b{color:var(--ink)}
.gsearch{display:flex;align-items:center;gap:8px;margin:0 0 12px}.gsearch input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}.gsearch input:focus{border-color:var(--accent);outline:none}.gsearch-close{height:36px;padding:0 10px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:600;flex:none}.gresult-count{font-size:12px;color:var(--sub);margin:0 2px 8px}.gresults{display:flex;flex-direction:column;gap:6px;max-height:58vh;overflow-y:auto}.gresult{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:var(--soft);text-align:left}.gresult:active{background:var(--line)}.gresult-type{flex:none;min-width:44px;color:var(--sub);font-size:11px;font-weight:700}.gresult-main{min-width:0;flex:1}.gresult-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}.gresult-meta{display:block;margin-top:3px;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gresult-arrow{flex:none;color:var(--sub);font-size:17px}
.fcard{padding:12px 0;border-top:1px solid var(--line)}.fcard.req{background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:12px;padding:12px 10px;border-top:0;margin:6px 0}
.fc-top{display:flex;align-items:center;gap:10px}.fav{flex:none;width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink)}
.fc-name{flex:1;min-width:0}.fc-name b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fc-name small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.fc-top .tbtn{height:30px;padding:0 10px;font-size:12px}.fc-pin{border-radius:999px;color:var(--sub)}.fc-pin.on{color:var(--star)}
.fc-main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.fc-main .tbtn{height:38px;padding:0 4px;font-size:13px}.fc-main .tbtn.pri{background:var(--accent);color:var(--accent-ink)}
.fc-share{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.chipt{white-space:nowrap;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:600;color:var(--sub)}.chipt.on{background:var(--planner-color);border-color:var(--planner-color);color:var(--planner-ink,#1c1c1e)}.chipt.on::before{content:'✓ '}
.fc-rm{margin-left:auto;height:28px;padding:0 4px;background:none;border:0;font-size:12px;color:var(--sub);text-decoration:underline}.fc-rm.armed{color:var(--now)}
.fsec{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 2px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:var(--soft);margin:8px 0}.codebox small{display:block;font-size:12px;color:var(--sub)}.codebox .code{font-size:20px;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.gear,.bell{position:relative}.fav-ic svg{width:17px;height:17px}.fav-ic.k-ok{color:var(--accent)}.fav-ic.k-no{color:var(--now)}.bell .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--now);color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--bg)}.gear .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--now);box-shadow:0 0 0 2px var(--card)}
.mc i{display:block;font-style:normal;font-size:9px;line-height:18px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--card);font-weight:700}
.ftt{display:grid;gap:3px;margin:6px 0 14px}.ftt .fh{font-size:11px;color:var(--sub);text-align:center}.ftt .fcol{position:relative;border-radius:8px;background:var(--soft)}.ftt .ftm{position:relative;font-size:10px;color:var(--sub)}.ftt .ftm span{position:absolute;right:3px;transform:translateY(-5px)}
.ftt .fb{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 4px;font-size:10px;line-height:1.25;overflow:hidden;color:#1c1c1e;background:var(--c)}.ftt .fb small{display:block;opacity:.7}
#app-toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;text-align:center}#app-toast.on{opacity:1;transform:translate(-50%,0)}

#undo-bar{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9998;display:none;align-items:center;gap:12px;max-width:calc(100% - 28px);padding:10px 12px 10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px;font-weight:700}#undo-bar.on{display:flex}#undo-bar button{padding:6px 10px;border-radius:9px;background:var(--bg);color:var(--ink);font-weight:800;white-space:nowrap}
.sync-state{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px}.sync-dot{width:7px;height:7px;border-radius:50%;background:#9ca3af}.sync-state.saving .sync-dot{background:#e2b23c}.sync-state.ok .sync-dot{background:#72b88a}.sync-state.err .sync-dot{background:var(--now)}
.ntc-sec{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 4px}.ntc-sec:first-of-type{margin-top:4px}
.ntc{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.ntc:first-child{border-top:0}.ntc .fc-name small{white-space:normal}.ntc.unread .fc-name b::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--now);margin-left:6px;vertical-align:middle}
.ntc .fc-name b{white-space:normal;line-height:1.35}.ntc .tbtn{height:30px;padding:0 10px;font-size:12px;flex:none}
.meetsug{margin:4px 0 8px}.meetsug>span{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}.meetsug-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.meetsug-row::-webkit-scrollbar{display:none}.meetsug-row small{align-self:center;font-size:12px;color:var(--sub)}
.sugchip{flex:none;height:28px;padding:0 10px;border-radius:999px;border:1px dashed var(--accent);background:transparent;font-size:12px;font-weight:600;color:var(--ink)}.sugchip.on{border-style:solid;background:var(--accent);color:var(--accent-ink)}
.meetnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 8px}.meetnav b{font-size:14px}.meetnav .tbtn{height:32px;min-width:40px}.meetnav .tbtn[disabled]{opacity:.35}
.meetlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:0 0 8px}.meetlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;background:var(--soft);border:1px solid var(--line)}
.meetgrid{display:grid;grid-template-columns:24px repeat(7,minmax(0,1fr));gap:2px;max-height:50vh;overflow-y:auto;margin-bottom:6px}
.meetgrid .mgh{position:sticky;top:0;z-index:1;background:var(--card);font-size:11px;text-align:center;color:var(--sub);padding:0 0 4px;line-height:1.25}
.meetgrid .mgh b{display:block;font-size:13px;color:var(--ink)}.meetgrid .mgh.td b{color:var(--accent)}.meetgrid .mgh em{display:block;white-space:nowrap;font-style:normal;font-size:9px;font-weight:700;color:var(--now)}
.meetgrid .mt{font-size:10px;color:var(--sub);text-align:right;padding-right:3px;line-height:1;transform:translateY(-5px)}
.mc{height:20px;border-radius:4px;background:var(--soft);border:1px solid var(--line);padding:0;cursor:pointer}
.mc.fb,.meetlegend i.fb{background:color-mix(in srgb,var(--sub) 55%,var(--card));border-color:transparent}
.mc.mb,.meetlegend i.mb{background:repeating-linear-gradient(135deg,var(--soft) 0 4px,color-mix(in srgb,var(--sub) 45%,transparent) 4px 6px)}
.mc.fb,.mc.mb,.mc.past{cursor:default}.mc.past{opacity:.35}
.mc.pend,.mc.orig{outline:2px dashed var(--accent);outline-offset:-2px}
.mc.pick,.meetlegend i.pick{background:var(--accent);border-color:var(--accent)}
.mc.pick.fb,.mc.pick.mb{background:var(--now);border-color:var(--now)}
.requestbox{padding:14px;border-radius:14px;background:var(--soft);margin:10px 0 14px}.requestbox b,.requestbox small{display:block}.requestbox small{color:var(--sub);margin-top:5px;line-height:1.5}
.card.warn{border-color:color-mix(in srgb,var(--now) 45%,var(--line))}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.note{margin:8px 2px;padding:8px 10px;border-radius:10px;background:var(--soft);color:var(--sub);font-size:12px}
.hint{font-size:12px;color:var(--sub);margin:0 2px 10px;line-height:1.5}

/* month */
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mh span{text-align:center;font-size:12px;color:var(--sub);padding:2px 0 6px}
.mh span:nth-child(6){color:#6b8dc7}
.mh span:nth-child(7){color:#d0705f}
.mg{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:86px;padding:3px 2px;
  display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0;align-items:stretch}
.cell.out{opacity:.38}
.cell .n{font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums;align-self:flex-start}
.cell.we .n{color:#d0705f}
.cell.we:nth-child(7n+6) .n{color:#6b8dc7}
.cell.today .n{background:var(--accent);color:var(--accent-ink);font-weight:700}
.dots{display:flex;gap:2px;flex-wrap:wrap;min-height:5px;padding-left:2px}
.dots i{width:5px;height:5px;border-radius:50%}
.chip{display:block;font-size:9.5px;line-height:1.3;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ev{background:var(--c);color:#fff}
.chip.td{color:var(--sub);background:var(--soft)}
.more{font-size:9.5px;color:var(--sub);padding-left:2px}

/* timetable grid */
.tt-card{padding:8px 4px}
.tt-card .card-h{margin:0 8px 6px}
.tt-head,.tt-body{display:grid;grid-template-columns:28px repeat(var(--n),minmax(0,1fr))}
.tt-head button{padding:2px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.tt-head b{font-size:14px;color:var(--ink);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.tt-head .today b{background:var(--accent);color:var(--accent-ink)}
.tt-body{position:relative}
.tt-hrs{position:relative;height:var(--h)}
.tt-hrs span{position:absolute;right:4px;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.tt-col{position:relative;height:var(--h);border-left:1px solid var(--line);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.tt-col.today{background-color:color-mix(in srgb,var(--accent) 7%,transparent)}
.blk{position:absolute;display:block;border-radius:7px;padding:3px 4px;overflow:hidden;color:#fff;font-size:10.5px;line-height:1.25;
  background:var(--c);text-shadow:0 1px 1px rgba(0,0,0,.18);word-break:break-all;text-align:left}
.blk b{display:block;font-weight:700}
.blk small{display:block;font-size:9.5px;opacity:.92;margin-top:1px}
.blk.ev{background:var(--soft);background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink);text-shadow:none;border-left:3px solid var(--c)}
.tt.day .blk{font-size:13px;padding:6px 9px;border-radius:9px}
.tt.day .blk small{font-size:11px}
.tt.day .tt-body{grid-template-columns:34px minmax(0,1fr)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);font-variant-numeric:tabular-nums}
.slot.c{background:var(--c);color:#fff;font-weight:600}
.dd{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;display:inline-block;background:var(--soft);color:var(--sub);text-decoration:none}
.dd.soon{background:color-mix(in srgb,var(--accent) 20%,var(--card));color:var(--accent)}
.dd.hot{background:var(--now);color:#fff}
.dd.late{background:var(--soft);color:var(--now)}
.rp{font-style:normal;font-size:11px;color:var(--sub);margin-left:6px;white-space:nowrap}
.chip.due{background:transparent;color:var(--now);border:1px solid color-mix(in srgb,var(--now) 50%,transparent);padding:0 3px}
.gap{position:absolute;left:2px;right:2px;border-radius:7px;border:1.5px dashed color-mix(in srgb,var(--sub) 45%,transparent);
  background:color-mix(in srgb,var(--sub) 6%,transparent);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-align:center;line-height:1.2;padding:0 2px}
.tt.day .gap{font-size:12px}
.duebox{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--sub)}
.duebox input{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-size:14px;flex:1;min-width:0}
.duebox button{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--soft);font-weight:600}
.rt{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.rt:last-child{border-bottom:0}
.ctag{font-style:normal;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px 1px 5px;margin-left:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
  max-width:9em;overflow:hidden;text-overflow:ellipsis;vertical-align:1px;background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);text-decoration:none}
.ctag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
select.fld,.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.sel{height:36px;border-radius:10px;border:1px solid var(--line);background-color:var(--bg);padding-left:8px;font-size:14px;flex:1;min-width:0;color:var(--ink)}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:8px 0 0;padding:10px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--now) 10%,var(--card));border:1px solid color-mix(in srgb,var(--now) 30%,var(--line));font-size:14px;font-weight:700}
.exbar small{font-size:12px;color:var(--sub);font-weight:500}
.exbar b{color:var(--ink);font-variant-numeric:tabular-nums}
.cell.exam{background:color-mix(in srgb,var(--now) 8%,transparent)}
.cname{font-weight:700;display:inline-flex;align-items:center;gap:6px;text-align:left}
.cname em{font-style:normal;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0 2px}
.big small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.rt .ttxt small{display:block;color:var(--sub);font-size:12px;margin-top:2px}

/* todos */
.todos{list-style:none;margin:0;padding:0}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700;margin-top:1px;text-align:center}
.todo.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ttxt{flex:1;min-width:0;line-height:1.45;padding-top:1px;word-break:break-word;cursor:pointer}
.todo.done .ttxt{color:var(--sub);text-decoration:line-through}
.tag{font-style:normal;font-size:11px;color:var(--sub);background:var(--soft);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;text-decoration:none;display:inline-block}
.star{flex:none;font-size:18px;color:var(--line);line-height:1;padding:2px;text-align:center}
.star.on{color:var(--star)}
.mini{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--soft);text-align:center}.mini.on{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}.mini:disabled{opacity:.48;cursor:not-allowed}
.tododel{width:24px;height:24px;padding:0;border-radius:50%;font-size:16px;line-height:24px;color:var(--sub)}
.empty{color:var(--sub);font-size:13px;padding:8px 2px}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin:0 2px 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.add input:focus{border-color:var(--accent);outline:none}
.add button{height:42px;padding:0 15px;border-radius:12px;background:var(--planner-color);color:var(--planner-ink,#1c1c1e);font-weight:700;font-size:14px;text-align:center}
.memo{width:100%;min-height:96px;resize:vertical;border:0;border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px;line-height:1.5}
.memo:focus{outline:2px solid var(--accent)}
.memo-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.memo-photo{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;background:var(--soft)}
.memo-photo img{width:100%;height:100%;object-fit:cover}
.memo-photo .lt-x{position:absolute;top:3px;right:3px;background:rgba(28,28,30,.62);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px}
.memo-addphoto{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;height:34px;padding:0 12px;font-size:13px}

/* timetable list */
.course{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.course:last-of-type{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px;flex:none}
.course .nm{font-weight:700}
.course .cd{font-size:12px;color:var(--sub);margin-left:6px}
.course .slots{margin-top:7px}
.course-overview{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.course-overview .lbl{margin:0 0 6px;color:var(--sub)}
.course-line{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.course-line b{font-size:12px;min-width:42px;color:var(--sub);font-variant-numeric:tabular-nums}
.course-line span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-class{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0 10px;padding:12px 14px;border-radius:14px;background:var(--c);color:#1c1c1e;text-align:left}
.next-class>span{display:block;flex:1;min-width:0}
.next-class small,.next-class b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-class small{font-size:11px;opacity:.68;margin-bottom:3px}
.next-class b{font-size:15px}
.next-class em{font-style:normal;font-size:12px;white-space:nowrap}
.next-class .chev{font-size:22px;opacity:.55}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow span{font-size:14px}
.setrow small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.monthopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 0 8px}
.monthopt{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.monthopt input{width:17px;height:17px;accent-color:var(--accent);margin:0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(24,18,12,.45);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:20px;padding-bottom:16px}}
.sheet h3{margin:0 0 12px;font-size:17px}
.onboard{text-align:center;padding:8px 2px 2px}.onboard .hint{max-width:330px;margin:0 auto 16px}.onboard-dots{display:flex;justify-content:center;gap:5px;margin:0 0 18px}.onboard-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.onboard-dots i.on{background:var(--accent)}.onboard .pal{justify-content:center}.onboard-demo{min-height:72px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--soft);margin:10px 0 16px;font-weight:700;color:var(--ink)}
.fld{display:block;width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;margin-bottom:10px}
.fld:focus{border-color:var(--accent);outline:none}

.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}

.sw{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{padding:7px 13px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.seg button.on{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}
.qscope-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;flex-wrap:nowrap}.qscope-tabs button{padding:8px 4px;min-width:0;white-space:nowrap}.routine-quick-add{width:100%;height:44px;border-radius:12px;background:var(--planner-color);color:var(--planner-ink,#1c1c1e);font-weight:800;text-align:center}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 2px 14px}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;height:44px;border-radius:12px;font-weight:700;font-size:15px;text-align:center}
.b-save{background:var(--planner-color);color:var(--planner-ink,#1c1c1e)}
.b-ghost{background:var(--soft)}
.b-del{background:var(--soft);color:#c9524a;flex:0 0 auto!important;padding:0 16px}
.b-del.armed{background:#c9524a;color:#fff}
.ta{display:block;width:100%;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-bottom:10px;resize:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}


/* ===== 하루 마감 · 시험 준비 ===== */
.dayclose-banner{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin:10px 0;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--edge));border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,var(--card));text-align:left}.dayclose-banner span{flex:1;min-width:0}.dayclose-banner b{display:block;font-size:14px}.dayclose-banner small{display:block;color:var(--sub);font-size:12px;margin-top:2px}.close-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.close-summary div{padding:11px 8px;border-radius:12px;background:var(--soft);text-align:center}.close-summary b{display:block;font-size:18px}.close-summary small{color:var(--sub);font-size:11px}.exam-prep{margin:8px 0 12px;padding:10px;border-radius:12px;background:var(--soft)}.exam-prep-row{display:flex;align-items:center;gap:8px;padding:6px 0}.exam-prep-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}.exam-prep-row input[type=text]{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);font-size:14px}.exam-prep-add{display:flex;gap:6px;margin-top:6px}.exam-prep-add input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:16px}.exam-prep-add button{height:38px;padding:0 11px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700}.prep-progress{font-size:11px;color:var(--sub);margin-left:6px}.exam-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.exam-meta .fld{margin:0}.prep-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.prep-head .tbtn{height:30px;font-size:12px}.prep-meter{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:7px 0 9px}.prep-meter i{display:block;height:100%;background:var(--accent)}.home-smart{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.home-smart button{height:32px;padding:0 10px;border-radius:9px;background:var(--soft);font-size:12px;font-weight:700}.month-review{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}.month-review::-webkit-scrollbar{display:none}.month-review>div{flex:0 0 auto;min-width:110px;padding:9px 10px;border-radius:10px;background:var(--soft)}.month-review small{display:block;color:var(--sub);font-size:10px}.month-review b{display:block;margin-top:2px;font-size:13px}
.close-word{margin:10px 0 12px}.close-word .lbl{font-size:13px;color:var(--ink);font-weight:700}.close-word input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:0 13px;font-size:16px;color:var(--ink)}.close-word input:focus{outline:2px solid var(--accent);border-color:transparent}.month-review{margin:0 0 10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 20%,var(--edge))}.month-review b{font-size:14px}.month-review small{display:block;color:var(--sub);font-size:12px;margin-top:3px}.month-words{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.month-words span{padding:4px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:11px}.home-priority{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.home-priority button{height:34px;padding:0 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:700}.home-priority button.primary{background:var(--accent);color:var(--accent-ink)}.exam-auto{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}.exam-auto .fld{margin:0}.exam-auto-btn{width:100%;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;margin-bottom:6px}

/* ===== 일기장 · 책 보기 ===== */
.diary-library{max-width:720px;margin:0 auto}.diary-library-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.diary-library-head>div{flex:1}.diary-library-head h3{margin:0;font-size:20px}.diary-library-head small{color:var(--sub)}
.diary-datebar{display:flex;align-items:center;gap:8px;margin:8px 0 14px}.diary-datebar input{flex:1;min-width:0;height:42px;border:1px solid var(--edge);border-radius:12px;background:var(--soft);padding:0 12px;color:var(--ink);font:inherit}.diary-datebar button{height:42px;padding:0 14px;border-radius:12px;background:var(--soft);font-weight:700;color:var(--ink)}
.diary-book{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:22px 20px 24px;min-height:390px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--edge) 35%,transparent)}.diary-book:before{content:'';position:absolute;left:46px;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--planner-color) 42%,transparent)}.diary-book-date{position:relative;margin-left:42px;padding-bottom:12px;border-bottom:1px solid var(--line)}.diary-book-date b{font-size:19px}.diary-book-date small{display:block;color:var(--sub);margin-top:3px}.diary-book-body{position:relative;margin-left:42px;padding-top:12px;line-height:1.9;white-space:pre-wrap;font-size:16px;min-height:210px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,color-mix(in srgb,var(--line) 68%,transparent) 30px)}.diary-book-note{position:relative;margin:18px 0 0 42px;padding:12px 14px;border-radius:12px;background:var(--soft);white-space:pre-wrap;line-height:1.65}.diary-book-note:empty{display:none}.diary-book-nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.diary-book-nav button{height:40px;padding:0 14px;border-radius:11px;background:var(--soft);font-weight:700;color:var(--ink)}.diary-book-nav button:disabled{opacity:.35}.diary-book-empty{display:grid;place-items:center;min-height:300px;text-align:center;color:var(--sub);line-height:1.6}.diary-library-shortcut{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}.diary-library-shortcut small{display:block;color:var(--sub);margin-top:3px}
@media(max-width:520px){.diary-book{padding:18px 14px 20px}.diary-book:before{left:31px}.diary-book-date,.diary-book-body,.diary-book-note{margin-left:27px}}

/* ===== 10분 일기 ===== */

}

    --accent:#f5f5f7; --accent-ink:#000000; --now:#ff6b6b; --edge:#2a2a2e; --hi:#18181b;
  }
}

function allSchoolProfiles(state){
  var cfg=state||(typeof S!=='undefined'?S:null),custom=cfg&&cfg.settings&&Array.isArray(cfg.settings.customSchools)?cfg.settings.customSchools:[];
  return SCHOOL_PROFILES.concat(custom).slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''),'ko');});
}
function schoolProfile(id,state){return allSchoolProfiles(state).find(function(x){return x.id===id;})||SCHOOL_PROFILES[0];}
function schoolName(id){return schoolProfile(id).name;}
function canonicalCampus(id,campus){
  var p=schoolProfile(id),raw=String(campus||'');
  return p.campuses.find(function(c){return c===raw;})||p.campuses.find(function(c){return raw.indexOf(c)>=0||c.indexOf(raw)>=0;})||p.campuses[0]||'';
}
function schoolHost(url){return String(url||'').replace(/^https?:\/\//i,'').split('/')[0];}
function schoolSearchUrl(url,query){return 'https://search.naver.com/search.naver?query='+encodeURIComponent('site:'+schoolHost(url)+' '+query);}
function schoolLinks(id,campus){
  var p=schoolProfile(id),camp=campus||p.campuses[0]||'',campusList=CAMPUS_LINKS[id]&&CAMPUS_LINKS[id][campus];
  var list=(campusList||p.links||[]).map(function(l){return {name:l.name,url:l.url};}),names=list.map(function(l){return l.name||'';}).join(' ');
  return list.map(function(l){return {id:uid(),name:l.name,url:l.url,schoolLink:true};});
}
function isGeneratedSchoolLink(l){
  if(!l)return false;
  if(l.schoolLink===false)return false;
  if(l.schoolLink===true)return true;
  var u=String(l.url||'').replace(/\/$/,'');
  if(/^https:\/\/search\.naver\.com\/search\.naver\?query=site%3A/i.test(u))return true;
  var found=false;
  function scan(arr){(arr||[]).forEach(function(x){if(x&&String(x.url||'').replace(/\/$/,'')===u)found=true;});}
  SCHOOL_PROFILES.forEach(function(p){scan(p.links);Object.keys(CAMPUS_LINKS[p.id]||{}).forEach(function(k){scan(CAMPUS_LINKS[p.id][k]);});});
  return found;
}
function schoolOptions(sel){return allSchoolProfiles().map(function(x){return '<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'<option value="__add__">+ 내 학교 직접 추가</option>';}
function schoolDatalist(){return allSchoolProfiles().map(function(x){return '<option value="'+esc(x.name)+'">';}).join('');}
function setSchool(id,campus){
  var p=schoolProfile(id),custom=(S.settings.links||[]).filter(function(l){return !isGeneratedSchoolLink(l);});
  var nextCampus=canonicalCampus(p.id,campus);
  S.settings.school=p.id;S.settings.schoolCampus=nextCampus;

  S.settings.links=schoolLinks(p.id,nextCampus).concat(custom);

}

function pad(n){return String(n).padStart(2,'0');}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}

  var dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),dim));

function normalize(s){
  var d=defaults(),hadSavedSchool=!!(s&&s.settings&&s.settings.school);
  var o=Object.assign(d,s||{});
  o.settings=Object.assign({weekend:false},(s&&s.settings)||{});

  if(!Array.isArray(o.settings.pinnedFriends))o.settings.pinnedFriends=[];

  o.settings.profileName=o.settings.profileName.trim().slice(0,20);
  if(typeof o.settings.profilePhoto!=='string')o.settings.profilePhoto='';
  if(typeof o.settings.homeStation!=='string')o.settings.homeStation='';

  if(o.settings.onboardDone===undefined)o.settings.onboardDone=hadSavedSchool;

  if(o.settings.remindOn===undefined)o.settings.remindOn=false;
  if(o.settings.schoolLastChecked==null)o.settings.schoolLastChecked=0;

  o.settings.logDisplay=Object.assign({wakeGoal:true,wakeTime:true,sleepTime:true,studyTotal:true},o.settings.logDisplay||{});
  if(o.settings.topShow===undefined)o.settings.topShow=true;
  if(!Array.isArray(o.settings.chatRooms))o.settings.chatRooms=[];
  if(!o.settings.chatHidden||typeof o.settings.chatHidden!=='object')o.settings.chatHidden={};
  if(!o.settings.chatRoomNames||typeof o.settings.chatRoomNames!=='object')o.settings.chatRoomNames={};
  ['classes','events','todos','routines','exams','allday','trackers','selfchat','diaries','dayCloses','ddays'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=d[k];});
  DEFAULT_TRK.forEach(function(t){if(!o.trackers.some(function(x){return x.id===t.id;}))o.trackers.push(Object.assign({},t));});
  if(!o.memos||typeof o.memos!=='object')o.memos={};
  if(!o.routineDone||typeof o.routineDone!=='object')o.routineDone={};
  if(!o.hourNotes||typeof o.hourNotes!=='object')o.hourNotes={};

  });
  Object.keys(o.memos).forEach(function(k){
    if(typeof o.memos[k]==='string')o.memos[k]={text:o.memos[k],photos:[]};
    else if(!o.memos[k]||typeof o.memos[k]!=='object')o.memos[k]={text:'',photos:[]};
    if(!Array.isArray(o.memos[k].photos))o.memos[k].photos=[];

  Object.keys(o.letters).forEach(function(k){
    if(o.letters[k]&&o.letters[k].photo)delete o.letters[k].photo;

  if(o.settings.letterOn===undefined)o.settings.letterOn=true;
  if(!o.settings.theme&&lsGet('planner.theme'))o.settings.theme=lsGet('planner.theme');
  if(!o.settings.bg&&lsGet('planner.bg'))o.settings.bg=lsGet('planner.bg');
  if(!o.settings.weekV2){o.settings.weekend=true;o.settings.weekV2=true;}
  if(o.settings.logOn===undefined)o.settings.logOn=true;

     현재 학교/캠퍼스 공식 링크만 다시 만들어요. 사용자 추가 링크는 보존해요. */
  var customLinks=o.settings.links.filter(function(l){return !isGeneratedSchoolLink(l);});
  o.settings.links=schoolLinks(o.settings.school,o.settings.schoolCampus).concat(customLinks);
  var OLDB=['#efe7da','#f4e0bf'];
  o.classes.forEach(function(c){if(OLDB.indexOf(c.color)>=0)c.color=BEIGE;});

  if(!o.settings.colorV2){
    o.classes.forEach(function(c){c.color=BEIGE;});
    o.events.forEach(function(e){if(PALETTE.indexOf(e.color)<0)e.color=PALETTE[5];});
    o.settings.colorV2=true;
  }
  return migratePlannerState(o);

/* ---------- 앱 데이터 스키마 / 안전 마이그레이션 ---------- */
var APP_SCHEMA_VERSION=5;
function migratePlannerState(st){
  if(!st||typeof st!=='object')return st;
  st.settings=st.settings&&typeof st.settings==='object'?st.settings:{};
  var v=Number(st.settings._schemaVersion||1);
  /* 마이그레이션은 추가형만 사용: 기존 사용자 필드를 삭제/초기화하지 않아요. */
  if(v<2){if(st.settings.onboardDone===undefined)st.settings.onboardDone=!!st.settings.schoolConfigured;v=2;}
  if(v<3){if(!st.settings.monthItems)st.settings.monthItems={appointment:true,event:true,dday:true,exam:true,allday:true,todo:true};v=3;}
  if(v<4){st.settings._lastMigrationAt=Date.now();v=4;}
  if(v<5){if(!st.settings._syncMeta)st.settings._syncMeta={cols:{},maps:{}};v=5;}
  st.settings._schemaVersion=APP_SCHEMA_VERSION;
  return st;
}
function plannerStateValid(st){
  if(!st||typeof st!=='object'||!st.settings||typeof st.settings!=='object')return false;
  var arrays=['classes','events','todos','routines','exams','allday','trackers','selfchat','diaries','dayCloses','ddays'];
  for(var i=0;i<arrays.length;i++)if(!Array.isArray(st[arrays[i]]))return false;
  return true;
}
var storageOK=true;

var S=load();
PREF_H=prefHash(S);
function backupData(){
  var d=JSON.parse(JSON.stringify(S||{}));
  delete d.updatedAt;
  return d;
}
function hasPlannerData(st){
  if(!st)return false;
  /* 기본 시간표·기본 기록 항목은 새 계정에도 들어 있어서 '내용'으로 치지 않아요.
     (예전엔 이것 때문에 빈 계정도 내용이 있는 걸로 판단돼, 빈 데이터가 덮어쓰는 걸 못 막았어요) */
  return ['classes','events','todos','routines','exams','allday','ddays','selfchat','diaries','dayCloses'].some(function(k){return Array.isArray(st[k])&&st[k].length>0;})||
    ['memos','logs','letters','hourNotes','retro','focus','fsess','routineDone'].some(function(k){return st[k]&&typeof st[k]==='object'&&Object.keys(st[k]).length>0;})||
    !!(st.settings&&((st.settings.chatRooms||[]).length||(st.settings.friendMemories||[]).length||st.settings.schoolConfigured||st.settings.onboardDone||st.settings.profileName||st.settings.school));
}
/* 계정별 보관함
   localStorage의 planner.v1 하나만 공유하면 로그아웃 후 다른 계정의 빈 데이터가
   이전 계정 데이터를 밀어낼 수 있어요. 계정별 사본을 따로 두고, 서버 동기화 전에
   현재 계정과 다음 계정의 데이터를 분리해요. */
function accountKey(uid){return uid?'planner.account.'+uid:'';}
function saveAccountState(uid,st){
  if(!uid||!st||/^loggedout:/.test(uid))return;
  try{lsSet(accountKey(uid),JSON.stringify(st));}catch(e){}
}
function readAccountState(uid){
  if(!uid)return null;
  var raw=lsGet(accountKey(uid));
  try{return raw?normalize(JSON.parse(raw)):null;}catch(e){return null;}
}

/* ---------- 무거운 백업은 IndexedDB에 ----------
   예전엔 전체 사본(자동 백업 20개 + 날짜별 30개 + 로그아웃·정상상태 등)을 전부
   localStorage(약 5MB)에 넣어서 금방 꽉 찼고, 그 뒤로는 백업·저장이 조용히 실패했어요.
   이제 큰 사본은 전부 IndexedDB에 두고 localStorage엔 지금 상태만 둬요. */
var BK={db:null,wait:null,lastGoodAt:0};
function bkOpen(){
  if(BK.db)return Promise.resolve(BK.db);
  if(BK.wait)return BK.wait;
  BK.wait=new Promise(function(res){
    try{
      if(!window.indexedDB){BK.wait=null;res(null);return;}
      var req=indexedDB.open('planner-safe-backups-v1',2);
      req.onupgradeneeded=function(){var d=req.result;
        if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
      req.onsuccess=function(){BK.db=req.result;res(BK.db);};
      req.onerror=function(){BK.wait=null;res(null);};
      req.onblocked=function(){BK.wait=null;res(null);};
    }catch(e){BK.wait=null;res(null);}
  });
  return BK.wait;
}
function bkPut(k,raw){
  if(!raw)return Promise.resolve(false);
  return bkOpen().then(function(db){
    if(!db){try{localStorage.setItem('planner.bk.'+k,raw);return true;}catch(e){return false;}}
    return new Promise(function(res){try{var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put({at:Date.now(),raw:raw},k);tx.oncomplete=function(){res(true);};tx.onerror=tx.onabort=function(){res(false);};}catch(e){res(false);}});
  });
}
/* 계정별 현재 상태 금고: localStorage와 별개로 IndexedDB에도 최신 전체 상태를 보관해요.
   시간이 지난 뒤 Safari/localStorage 또는 오래된 서버 상태가 문제를 일으켜도 이 사본과 합쳐 복구합니다. */
function currentVaultKey(uid){return uid?'current.'+uid:'current.local';}
function vaultPut(uid,st){
  if(!st)return Promise.resolve(false);
  var raw;try{raw=JSON.stringify(st);}catch(e){return Promise.resolve(false);}
  return bkPut(currentVaultKey(uid),raw);
}
function vaultGet(uid){
  return bkGetRec(currentVaultKey(uid)).then(function(rec){
    if(!rec||!rec.raw)return null;
    try{return normalize(JSON.parse(rec.raw));}catch(e){return null;}
  });
}
function restoreCurrentVault(uid){
  if(!uid)return Promise.resolve(false);
  return vaultGet(uid).then(function(v){
    if(!v)return false;
    var before=itemCount(S),vn=itemCount(v);
    /* 금고와 현재 상태를 항상 합쳐 한쪽에만 있는 항목을 보존합니다.
       설정은 prefsAt 규칙을 그대로 사용해 더 최근 설정을 따릅니다. */
    var joined=mergeState(S,v,null);
    if(JSON.stringify(joined)===JSON.stringify(S))return false;
    joined.updatedAt=Math.max(Date.now(),S.updatedAt||0,v.updatedAt||0);
    S=joined;PREF_H=prefHash(S);
    try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}
    saveAccountState(uid,S);
    if(vn>before&&typeof inAppToast==='function')inAppToast('기기 안전 보관함에서 플래너를 복구했어요');
    return true;
  });
}

function bkGetRec(k){
  return bkOpen().then(function(db){
    if(!db){
      var legacy=k==='logout'?'planner.logoutBackup':k.indexOf('logout.')===0?'planner.logoutBackup.'+k.slice(7):
        k==='lastGood'?'planner.lastGoodBackup':k.indexOf('lastGood.')===0?'planner.lastGoodBackup.'+k.slice(9):
        k==='remote'?'planner.remoteBackup':k==='prev'?'planner.prevBackup':k.indexOf('snap.')===0?'planner.snap.'+k.slice(5):'';
      var r=lsGet('planner.bk.'+k)||(legacy?lsGet(legacy):null);
      return r?{at:0,raw:r}:null;
    }
    return new Promise(function(res){try{var q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=function(){res(q.result&&q.result.raw?q.result:null);};q.onerror=function(){res(null);};}catch(e){res(null);}});
  });
}
function bkDel(k){
  return bkOpen().then(function(db){
    if(!db){try{localStorage.removeItem('planner.bk.'+k);}catch(e){}return;}
    try{db.transaction('kv','readwrite').objectStore('kv').delete(k);}catch(e){}
  });
}
/* 계정별 키를 먼저 찾고, 없으면 공용 키 */
function bkFirst(keys){
  return keys.filter(Boolean).reduce(function(p,k){return p.then(function(r){return r||bkGetRec(k);});},Promise.resolve(null));
}
function bkOwner(){var o=Sync&&Sync.uid||lsGet('planner.activeUser')||'';return /^loggedout:/.test(o)?o.slice(10):o;}
function bkKeys(name){var o=bkOwner();return o?[name+'.'+o]:[name];}
function savePrevBackup(st){
  if(!st||!hasPlannerData(st))return Promise.resolve(false);
  var raw;try{raw=JSON.stringify(st);}catch(e){return Promise.resolve(false);}
  var o=bkOwner();
  return bkPut(o?'prev.'+o:'prev',raw);
}
/* 자동 백업 기록: 최근 24시간을 촘촘히 보존 (15분 간격, 최대 96개) */
function bkRingAdd(st,force){
  if(!st||!hasPlannerData(st))return Promise.resolve(false);
  var last=+(lsGet('planner.idbAt')||0);
  if(!force&&Date.now()-last<15*60000)return Promise.resolve(false);
  lsSet('planner.idbAt',String(Date.now()));
  var data;try{data=JSON.parse(JSON.stringify(st));}catch(e){return Promise.resolve(false);}
  var owner=bkOwner();
  return bkOpen().then(function(db){
    if(!db)return false;
    return new Promise(function(res){try{var tx=db.transaction('snapshots','readwrite'),os=tx.objectStore('snapshots');
      os.add({at:Date.now(),owner:owner,data:data});
      var kr=os.getAllKeys();kr.onsuccess=function(){var ks=kr.result||[];ks.slice(0,Math.max(0,ks.length-96)).forEach(function(k){os.delete(k);});};
      tx.oncomplete=function(){res(true);};tx.onerror=tx.onabort=function(){res(false);};}catch(e){res(false);}});
  });
}
function bkRingList(){
  return bkOpen().then(function(db){
    if(!db)return [];
    return new Promise(function(res){try{var q=db.transaction('snapshots','readonly').objectStore('snapshots').getAll();q.onsuccess=function(){res((q.result||[]).sort(function(a,b){return b.at-a.at;}));};q.onerror=function(){res([]);};}catch(e){res([]);}});
  });
}
function saveLocalBackupLayers(st){bkRingAdd(st,true);}
/* 예전 localStorage 사본을 IndexedDB로 옮기고 자리를 비워요 */
function bkMigrate(){
  var moves=[];
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k)continue;var m=null;
    if(k==='planner.logoutBackup')m='logout';
    else if(k.indexOf('planner.logoutBackup.')===0)m='logout.'+k.slice(21);
    else if(k==='planner.lastGoodBackup')m='lastGood';
    else if(k.indexOf('planner.lastGoodBackup.')===0)m='lastGood.'+k.slice(23);
    else if(k==='planner.remoteBackup')m='remote';
    else if(k==='planner.prevBackup')m='prev';
    else if(k.indexOf('planner.snap.')===0)m='snap.'+k.slice(13);
    else if(k==='planner.backupRing')m='__ring';
    if(m)moves.push([k,m]);}}catch(e){}
  if(!moves.length)return Promise.resolve();
  return bkOpen().then(function(db){
    if(!db)return;
    return moves.reduce(function(p,mv){return p.then(function(){
      var raw=lsGet(mv[0]);if(!raw)return;
      if(mv[1]==='__ring'){
        var ring=[];try{ring=JSON.parse(raw)||[];}catch(e){}
        return new Promise(function(res){try{var tx=db.transaction('snapshots','readwrite'),os=tx.objectStore('snapshots');
          (Array.isArray(ring)?ring:[]).forEach(function(x){if(x&&x.data)os.add({at:x.at||0,owner:'',data:x.data});});
          tx.oncomplete=function(){try{localStorage.removeItem(mv[0]);}catch(e){}res();};tx.onerror=tx.onabort=function(){res();};}catch(e){res();}});
      }
      return bkPut(mv[1],raw).then(function(ok){if(ok){try{localStorage.removeItem(mv[0]);}catch(e){}}});
    });},Promise.resolve());
  }).then(function(){
    /* 공간이 생겼으니 지금 상태를 다시 저장해봐요 */
    var was=storageOK;
    try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}
    var o=bkOwner();if(o)saveAccountState(o,S);
    if(!was&&storageOK&&!M.type)render();
  });
}
/* 저장이 꽉 찼을 때 비상용: IndexedDB로 이미 옮겨진 옛 사본 자리만 비워요 */
function bkFreeSpace(){
  try{var del=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&(k==='planner.backupRing'||k.indexOf('planner.snap.')===0))del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});}catch(e){}
}
/* 로그아웃·계정 전환 때만 호출돼요 (예전엔 앱을 닫을 때마다 덮어써서 '로그아웃 전' 백업이 늘 지금 상태였어요) */
function saveLogoutBackup(uid,st){
  if(!st||!hasPlannerData(st))return;
  if(uid&&/^loggedout:/.test(uid))uid=uid.slice(10);
  var raw;try{raw=JSON.stringify(st);}catch(e){return;}
  saveAccountState(uid,st);
  bkPut('logout',raw);if(uid)bkPut('logout.'+uid,raw);

  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function linkDeadlineDefault(){
  var d=new Date();d.setDate(d.getDate()+3);d.setHours(23,59,0,0);return localInputValue(d);
}
function linkDeadlineText(v){
  if(!v)return '마감 없음';
  try{var d=new Date(v);if(!isFinite(d))return v;return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+pad(d.getHours())+':'+pad(d.getMinutes());}catch(e){return v;}
}
function linkDeadlinePassed(p){
  if(!p||!p.responseDeadline)return false;var t=new Date(p.responseDeadline).getTime();return isFinite(t)&&Date.now()>t;
}

function createLink(){

      linkStart=+($('#f-lk-time-start')&&$('#f-lk-time-start').value),
      linkEnd=+($('#f-lk-time-end')&&$('#f-lk-time-end').value),
      responseDeadline=($('#f-lk-deadline')&&$('#f-lk-deadline').value)||'',
      placeRecommend=!!($('#f-lk-place-reco')&&$('#f-lk-place-reco').checked),
      expectedPeople=Math.max(2,Math.min(30,+($('#f-lk-expected')&&$('#f-lk-expected').value)||2)),

}

function mergeSettings(ls,rs){

function mergeState(loc,rem,base){
  var out=JSON.parse(JSON.stringify(loc));
  COLS.forEach(function(c){
    var have={};out[c].forEach(function(x){have[x.id]=1;});
    (rem[c]||[]).forEach(function(x){
      if(have[x.id])return;
      if(base&&base[c]&&base[c][x.id])return;   // 이 기기에서 지운 것
      out[c].push(x);                              // 다른 기기에서 새로 만든 것
    });
    if(base&&base[c]){ // 다른 기기에서 지운 것: base엔 있었는데 원격엔 없음
      var rid={};(rem[c]||[]).forEach(function(x){rid[x.id]=1;});
      out[c]=out[c].filter(function(x){return !(base[c][x.id]&&!rid[x.id]);});
    }
  });
  MAPS.forEach(function(m){var r=rem[m]||{};out[m]=out[m]||{};Object.keys(r).forEach(function(k){if(out[m][k]===undefined)out[m][k]=r[k];});});
  mergeSettings(out.settings||(out.settings={}),rem.settings||{});
  return normalize(out);
}
function applyRemote(st,at){

function reconcile(r){
  var rat=+r.updatedAt||0,rem=normalize(JSON.parse(r.json));
  var localAt=S.updatedAt||0;
  /* 내용이 있는 기기에 데이터 0개인 원격 상태가 들어오면 자동 반영하지 않아요.
     같은 계정의 빈 상태가 먼저 저장된 경우에도 사용자가 직접 선택하게 해요. */
  var localHasData=hasPlannerData(S),remoteHasData=hasPlannerData(rem);
  if(localHasData&&!remoteHasData&&rat!==localAt&&Sync.examGuardAt!==rat){
    Sync.examGuardAt=rat;
    try{bkPut(bkOwner()?'remote.'+bkOwner():'remote',JSON.stringify(S));}catch(e){}
    if(Sync.kind==='supa'){autoMerge(r,rat);return false;}
    return false;
  }
  var dirty=localAt>0&&(!Sync.lastSeen||localAt>Sync.lastSeen);
  /* 재로그인/다른 기기에서 계정 데이터를 불러올 때 원격 JSON에 일부 묶음이 빠져 있어도
     이 기기의 시간표·시험·일정을 삭제하지 않아요. 서버와 로컬 중 한쪽에만 있는 항목은
     우선 합쳐서 보존하고, 합쳐진 상태를 다시 계정에 저장합니다. */
  if(!dirty){
    if(!localHasData&&remoteHasData){applyRemote(rem,rat);Sync.lastSeen=rat;Sync.base=idsOf(S);saveMeta();return false;}
    if(localHasData&&!remoteHasData){Sync.lastSeen=rat;Sync.base=idsOf(S);saveMeta();return true;}
    var safe=mergeStateV2(S,rem);
    var changed=JSON.stringify(safe)!==JSON.stringify(rem);
    if(changed){safe.updatedAt=Math.max(Date.now(),rat+1);applyRemote(safe,safe.updatedAt);Sync.lastSeen=rat;Sync.base=idsOf(S);saveMeta();return true;}
    applyRemote(rem,rat);Sync.lastSeen=rat;Sync.base=idsOf(S);saveMeta();return false;
  }
  /* 데이터 손실 방지가 우선이라 로그인 동기화에서는 삭제 추론을 하지 않아요.
     명시적으로 앱에서 삭제한 직후의 일반 저장은 push()가 처리합니다. */
  var m=mergeStateV2(S,rem);
  m.updatedAt=Math.max(Date.now(),rat+1);applyRemote(m,m.updatedAt);
  Sync.lastSeen=rat;Sync.base=idsOf(S);saveMeta();return true;
}

function cloudSnapshotTiers(now,json){

     - 시간별: 그 시간의 최신 상태로 갱신 (저장할 때마다가 아니라 10분에 한 번)
     - 일별·월별: 그날/그달 처음 저장된 상태만 남기고 덮어쓰지 않아요.
       (예전엔 저장할 때마다 오늘·이번 달 사본까지 덮어써서, 데이터가 날아가면 그 사본도 같이 날아갔어요) */

  var uid=Sync.uid,sb=Sync.sb;
  encryptCloudValue(json).then(function(cipher){
    var row=function(k){return {user_id:uid,date:k,json:cipher,updated_at:Date.now()};};
    return sb.from('planner_snapshots').upsert([row(hour)]).then(function(r1){
      if(r1&&r1.error)throw r1.error;
      return sb.from('planner_snapshots').upsert([row(day),row(month)],{ignoreDuplicates:true});
    }).then(function(r2){
      if(r2&&r2.error)throw r2.error;

  }).catch(function(e){
    Sync.snapErr=syncErrorText(e)||'알 수 없는 오류';

/* ---------- 빠른 입력: "내일 3시 경제학 과제" ---------- */
function parseQuickTodo(raw){
  var txt=' '+raw+' ',out={},T=new Date(),t0=new Date(T.getFullYear(),T.getMonth(),T.getDate()),date=null,m;
  var WD='월화수목금토일';
  function cut(re){txt=txt.replace(re,' ');}
  function mark(d,deadline){if(deadline)out.due=dkey(d);else date=d;}
  m=txt.match(/\s(오늘|내일|낼|모레|글피)(\s*(까지|마감))?(?=\s|에\s)/);
  if(m){mark(addDays(t0,{'오늘':0,'내일':1,'낼':1,'모레':2,'글피':3}[m[1]]),!!m[2]);cut(m[0]);}
  if(!m||!date&&!out.due){
    m=txt.match(/\s(이번\s?주|다음\s?주|담주)?\s*([월화수목금토일])요일(\s*(까지|마감))?(?=\s|에\s)/);
    if(m){var wi=WD.indexOf(m[2]),d;
      if(m[1]&&/다음|담/.test(m[1]))d=addDays(mondayOf(t0),7+wi);
      else if(m[1])d=addDays(mondayOf(t0),wi);
      else{d=addDays(t0,(wi-dow(t0)+7)%7);}
      mark(d,!!m[3]);cut(m[0]);}
  }
  if(!date&&!out.due){
    m=txt.match(/\s(\d{1,2})\s?(?:\/|월\s?)(\d{1,2})일?(\s*(까지|마감))?(?=\s|에\s)/);
    if(m){var mo=+m[1],da=+m[2];
      if(mo>=1&&mo<=12&&da>=1&&da<=31){var d2=new Date(t0.getFullYear(),mo-1,da);if(d2-t0<-60*864e5)d2=new Date(t0.getFullYear()+1,mo-1,da);
        if(d2-t0<=200*864e5){mark(d2,!!m[3]);cut(m[0]);}}}
  }
  m=txt.match(/\s(오전|오후|아침|저녁|밤)?\s*(\d{1,2})시(?:\s*(반|(\d{1,2})분))?(?:에|부터)?(?=\s)/);
  if(m&&!/시간/.test(m[0])){
    var h=+m[2],mi=m[3]==='반'?30:(+m[4]||0);
    if(h<=24&&mi<60){
      if(/오후|저녁|밤/.test(m[1]||'')){if(h<12)h+=12;}
      else if(!m[1]&&h>=1&&h<=7)h+=12;
      if(h===24)h=0;
      out.time=fmt(h*60+mi);cut(m[0]);}
  }else{
    m=txt.match(/\s([01]?\d|2[0-3]):([0-5]\d)(?:에|부터)?(?=\s)/);
    if(m){out.time=fmt(+m[1]*60+(+m[2]));cut(m[0]);}
  }
  var names=courseNames().slice().sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<names.length;i++){var nm=names[i];if(nm.length>=2&&txt.indexOf(nm)>=0){out.course=nm;var rest=txt.replace(nm,' ').replace(/\s+/g,' ').trim();if(rest)txt=' '+rest+' ';break;}}
  if(date)out.key=dkey(date);
  out.text=txt.replace(/\s+/g,' ').trim()||raw.trim();
  return out;
}
function quickTodoToast(q){
  var bits=[];
  if(q.key){var n=diffDays(q.key);bits.push(n===0?'오늘':n===1?'내일':n===2?'모레':mdTxt(parseKey(q.key)));}
  if(q.time)bits.push(timeShort(q.time));
  if(q.due)bits.push('마감 '+mdTxt(parseKey(q.due)));
  if(q.course)bits.push(q.course);
  return bits.length?'넣었어요 · '+bits.join(' · '):'';
}

function openCnt(n){return S.todos.filter(function(t){return t.course===n&&!t.done;}).length;}
function pasteDayIndex(text){
  var m=String(text||'').match(/(?:^|[\s\t,|\[\(])(월|화|수|목|금|토|일)(?:요일)?(?=$|[\s\t,|\]\)])/);
  return m?DAYS.indexOf(m[1]):-1;
}
function pasteTimePair(text){
  var range=String(text||'').match(/(\d{1,2})(?::(\d{2}))?\s*(?:시)?\s*(?:~|〜|-|–|—|부터)\s*(\d{1,2})(?::(\d{2}))?\s*(?:시)?/);
  if(range){
    var sm=Number(range[1])*60+Number(range[2]||0),em=Number(range[3])*60+Number(range[4]||0);
    return {start:fmt(sm),end:fmt(em),text:range[0]};
  }
  var xs=[],re=/(\d{1,2}):(\d{2})/g,m;
  while((m=re.exec(String(text||'')))&&xs.length<2)xs.push({m:Number(m[1])*60+Number(m[2]),text:m[0]});
  return xs.length>=2?{start:fmt(xs[0].m),end:fmt(xs[1].m),text:xs[0].text+' '+xs[1].text}:null;
}
function parsePastedClasses(raw){
  var out=[],seen={};
  String(raw||'').split(/\r?\n/).forEach(function(line){
    var src=line.trim();if(!src||/^(시간표|요일|월|화|수|목|금|토|일)\s*(시간|과목|수업)?$/i.test(src))return;
    var day=pasteDayIndex(src),tm=pasteTimePair(src);if(day<0||!tm)return;
    var name=src.replace(tm.text,' ');
    name=name.replace(/(?:^|[\s\t,|\[\(])(월|화|수|목|금|토|일)(?:요일)?(?=$|[\s\t,|\]\)])/g,' ');
    name=name.replace(/[\t|]+/g,' ').replace(/^[\s,;:–—-]+|[\s,;:–—-]+$/g,'').replace(/\s{2,}/g,' ').trim();
    if(!name||name.length>60)return;
    if(tm.end<=tm.start)return;
    var key=name+'|'+day+'|'+tm.start+'|'+tm.end;if(seen[key])return;seen[key]=1;
    out.push({name:name,sub:'',day:day,start:tm.start,end:tm.end,color:defCol()});
  });
  return out;
}

    var seen={};TTScan.rows=rows.filter(function(x){var k=x.name+'|'+x.day+'|'+x.start+'|'+x.end;if(seen[k])return false;seen[k]=1;return true;});

  }catch(e){if(m)m.textContent='시간표 분석에 실패했어요. '+(e&&e.message?e.message:'다시 시도해주세요.');}
  finally{TTScan.loading=false;}
}

  if(!u){bad('#f-lurl');return;}
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  if(M.id){var l=S.settings.links.find(function(x){return x.id===M.id;});if(l){l.name=n;l.url=u;l.schoolLink=false;}}
  else S.settings.links.push({id:uid(),name:n,url:u,schoolLink:false});

function syncProfileToCodes(){
  var sb=friendDb();if(!sb)return Promise.resolve();
  var name=(S.settings.profileName||'').trim(),photo=S.settings.profilePhoto||'';
  return sb.from('planner_friend_codes').update({display_name:name,photo:photo,updated_at:new Date().toISOString()}).eq('user_id',Sync.uid).then(function(r){
    if(r.error&&/photo|updated_at|column|schema cache/i.test(r.error.message||''))return sb.from('planner_friend_codes').update({display_name:name}).eq('user_id',Sync.uid);
    return r;
  });
}

  openModal('<h3>프로필 사진 맞추기</h3><div class="profile-crop-wrap"><div class="profile-crop-box" id="profile-crop-box"><img id="profile-crop-img" alt="프로필 사진 미리보기"><i class="profile-crop-ring"></i></div></div><div class="crop-help">사진을 움직이고 확대해서 동그라미 안에 맞춰주세요</div><div class="crop-zoom"><span>−</span><input id="profile-crop-zoom" type="range" min="1" max="3" step="0.01" value="1"><span>＋</span></div><div class="acts"><button class="b-ghost" data-act="close">취소</button><button class="b-save" data-act="profile-crop-save">이대로 사용</button></div>');
  requestAnimationFrame(function(){

    var z=box.clientWidth,base=Math.max(z/img.width,z/img.height);M.cropBase=base;M.cropScale=1;

  });

function drawProfileCrop(){
  if(M.type!=='profile-crop')return;var box=$('#profile-crop-box'),el=$('#profile-crop-img');if(!box||!el||!M.cropImg)return;
  var sc=M.cropBase*M.cropScale,w=M.cropImg.width*sc,h=M.cropImg.height*sc,z=box.clientWidth;
  M.cropX=Math.min(0,Math.max(z-w,M.cropX));M.cropY=Math.min(0,Math.max(z-h,M.cropY));
  el.style.width=w+'px';el.style.height=h+'px';el.style.transform='translate('+M.cropX+'px,'+M.cropY+'px)';
}
function saveProfileCrop(){
  if(M.type!=='profile-crop'||!M.cropImg)return;var box=$('#profile-crop-box'),z=box?box.clientWidth:300,sc=M.cropBase*M.cropScale,c=document.createElement('canvas');c.width=256;c.height=256;var ctx=c.getContext('2d'),k=256/z;
  ctx.drawImage(M.cropImg,M.cropX*-1/sc,M.cropY*-1/sc,z/sc,z/sc,0,0,256,256);
  var url=null;try{url=c.toDataURL('image/jpeg',0.82);}catch(e){}
  if(!url){friendNote('사진을 저장하지 못했어요');return;}
  S.settings.profilePhoto=url;save();closeModal();render();

  var opt={body:body,tag:tag,icon:'icon-512.png',badge:'icon-512.png'};

  try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(r){if(r&&r.showNotification)r.showNotification(title,opt).catch(plain);else plain();}).catch(plain);else plain();}catch(e){plain();}

function friendNotifyScan(){
  var seen=FriendSync.notified||(FriendSync.notified={}),first=!FriendSync.notifyReady,items=[];
  (FriendSync.invitesIn||[]).forEach(function(x){if(!FriendSync.inviteNames[x.from_user])return;items.push(['inv:'+x.id,'새 친구 요청',inviteName(x.from_user)+'님이 친구 연결을 요청했어요']);});
  var whenOf=function(p){return p.date?slotText(p.date,p.start?toMin(p.start):null,p.start?(p.end?toMin(p.end):toMin(p.start)+60):null):'';};
  (FriendSync.requests||[]).forEach(function(r){var p=r.payload||{},when=whenOf(p);
    if(r.to_user===Sync.uid&&r.status==='pending')items.push(['req:'+r.id,'새 약속 요청',requestFriendCode(r.from_user)+'님 · '+(p.what||p.place||'약속')+(when?' · '+when:'')]);});

  (FriendSync.shared||[]).forEach(function(r){var p=r.payload||{},who=requestFriendCode(sharedFriendOf(r));
    if(p.place&&p.placeConfirmedBy&&p.placeConfirmedBy!==Sync.uid)items.push(['plc:'+r.request_id+':'+p.place,'장소가 정해졌어요',who+'님과 약속 장소가 '+euro(p.place)+' 정해졌어요',p.date]);

    var fb=p.feedback||{},fid=sharedFriendOf(r);if(fb[fid]==='yes'&&fb[Sync.uid]!=='yes'&&!fb[Sync.uid])items.push(['fb:'+r.request_id,'약속 어땠어?',who+'님은 재밌었대요. 나도 답하면 추억으로 기록돼요',p.date]);});
  var nowOut={};(FriendSync.requests||[]).forEach(function(r){if(r.from_user===Sync.uid&&r.status==='pending')nowOut[r.id]=r;});
  var prev=FriendSync.prevOut||{};
  Object.keys(prev).forEach(function(id){if(nowOut[id])return;var r=prev[id],p=r.payload||{},when=whenOf(p),who=requestFriendCode(r.to_user);
    if((FriendSync.shared||[]).some(function(x){return x.request_id===id;}))items.push(['ok:'+id,'약속이 확정됐어요',who+'님이 '+(when||'약속')+' 약속을 수락했어요']);
    else if((FriendSync.requests||[]).some(function(x){return x.payload&&x.payload.counterOf===id;}))return;
    else items.push(['no:'+id,'약속 요청 결과',who+'님이 '+(when||'그 시간')+'은 어렵대요']);});
  FriendSync.prevOut=nowOut;
  items.forEach(function(it){if(seen[it[0]])return;seen[it[0]]=1;if(first)return;var res=/^(ok|no):/.test(it[0]);if(res){var rq=prev[it[0].slice(3)];pushNotice(it[0].slice(0,2),it[2],rq&&rq.payload&&rq.payload.date);}else if(it.length>3){pushNotice('ok',it[2],it[3]);res=true;}if(document.hidden)sysNotify(it[1],it[2],it[0]);else if(res&&M.type!=='notices')inAppToast(it[2]);});

  FriendSync.notifyReady=true;

function globalSearchDate(k){
  if(!k)return '';
  try{var d=parseKey(k);return mdTxt(d)+' ('+DAYS[dow(d)]+')';}catch(e){return k;}
}
function globalSearchRows(query){
  var q=String(query||'').trim().toLowerCase(),rows=[];
  if(!q)return rows;
  function add(kind,type,id,title,meta,extra,sort){
    var hay=[title,meta,extra].filter(function(x){return x!=null;}).join(' ').toLowerCase();
    if(hay.indexOf(q)<0)return;
    rows.push({kind:kind,type:type,id:String(id),title:String(title||''),meta:String(meta||''),extra:extra||'',sort:String(sort||'9999')});
  }
  S.todos.forEach(function(t){
    var meta=(t.scope==='inbox'?'언제든지':(t.key?tagOf(t):''))+(t.due?' · 마감 '+globalSearchDate(t.due):'')+(t.done?' · 완료':'');
    add('todo','할 일',t.id,t.text,meta,t.course,t.key||t.due||'9999');
  });
  S.routines.forEach(function(r){add('routine','반복 할 일',r.id,r.text,'매주 '+daysText(r.days),'','9999');});
  S.classes.forEach(function(c){add('class','수업',c.id,c.name,(DAYS[c.day]||'')+' · '+(c.start||'')+'–'+(c.end||''),c.sub,'9998');});
  S.events.forEach(function(e){
    var ek=e.date||e.from||'',kind=e.kind==='appointment'?'약속':'일정',meta=(ek?(e.from&&e.to?'기간 '+globalSearchDate(e.from)+' – '+globalSearchDate(e.to):globalSearchDate(ek)):'반복 일정');
    if(e.start)meta+=' · '+timeShort(e.start)+(e.end?'–'+timeShort(e.end):'');
    add('event',kind,e.id,eventLabel(e),meta,eventSub(e),ek||'9997');
  });
  S.allday.forEach(function(a){
    var ak=a.date||a.from||'',meta=a.days?'매주 '+daysText(a.days):(ak?(a.end?'기간 '+globalSearchDate(ak)+' – '+globalSearchDate(a.end):globalSearchDate(ak)):'반복 일정');
    add('allday','종일 일정',a.id,a.title,meta,'','9996');
  });
  S.exams.forEach(function(e){add('exam','시험',e.id,e.name,rangeTxt(e.start,e.end),e.kind||'시험 기간',e.start||'9995');});
  S.ddays.forEach(function(x){add('dday','D-day',x.id,x.title,ddLabel(x),x.date||'','9994');});
  Object.keys(S.memos||{}).forEach(function(k){var m=memoOf(k);if(m&&m.text)add('memo','하루 메모',k,m.text,globalSearchDate(k),'','9993');});
  (S.diaries||[]).forEach(function(d){add('diary','일기',d.id,(d.text||d.note||'일기').slice(0,40),globalSearchDate(dkey(new Date(d.finishedAt))),d.text||d.note||'','9991');});
  S.selfchat.forEach(function(m){var text=m.text||'사진';add('chat','채팅',m.id,text,(m.room?chatRoomLabel(m.room)+' · ':'')+globalSearchDate(dkey(new Date(m.at))),m.text||'','9992');});
  if(typeof FriendSync!=='undefined'&&(FriendSync.friends||[]).length){FriendSync.friends.forEach(function(f){add('friend','친구',f.id,friendLabel(f),'친구 · 약속/추억 보기',f.code||'','9991');});}
  var order={todo:0,routine:1,event:2,allday:3,exam:4,dday:5,class:6,friend:7,memo:8,chat:9};
  rows.sort(function(a,b){return (order[a.kind]-order[b.kind])||a.sort.localeCompare(b.sort);});
  return rows.slice(0,80);
}

  document.querySelectorAll('#f-srange button').forEach(function(b){b.classList.toggle('on',b.dataset.v===(M.single?'single':'period'));});
  document.querySelectorAll('#f-smode button').forEach(function(b){b.classList.toggle('on',b.dataset.v===M.mode);});

function saveSchedule(){
  var title=$('#f-stitle').value.trim();if(!title){bad('#f-stitle');return;}
  var target,source=M.mode==='all'?'allday':'event';
  if(M.repeat){
    var from=$('#f-from').value,to=$('#f-to').value||null;if(!from){bad('#f-from');return;}if(to&&to<from){bad('#f-to');return;}if(!M.days.length){$('#f-sdays').style.outline='2px solid var(--now)';return;}
    if(M.mode==='all')target={title:title,color:M.color,date:null,end:null,days:M.days.slice().sort(),from:from,to:to};
    else{var rs=$('#f-start').value,re=$('#f-end').value;if(!rs){bad('#f-start');return;}if(!re||toMin(re)<=toMin(rs)){bad('#f-end');return;}target={kind:'schedule',title:title,color:M.color,date:null,start:rs,end:re,days:M.days.slice().sort(),from:from,to:to};}
  }else{
    var date=$('#f-date').value;if(!date){bad('#f-date');return;}var endDate=!M.single?($('#f-enddate').value||''):'';if(endDate&&endDate<date){bad('#f-enddate');return;}
    if(M.mode==='all')target={title:title,color:M.color,date:date,end:endDate&&endDate!==date?endDate:null,days:null,from:null,to:null};
    else{var s=$('#f-start').value,e=$('#f-end').value;if(!s){bad('#f-start');return;}if(!e||toMin(e)<=toMin(s)){bad('#f-end');return;}target={kind:'schedule',title:title,color:M.color,date:endDate?null:date,start:s,end:e,days:null,from:endDate?date:null,to:endDate?endDate:null};}
  }
  if(M.id){S.events=S.events.filter(function(x){return x.id!==M.id;});S.allday=S.allday.filter(function(x){return x.id!==M.id;});}
  target.id=M.id||uid();if(source==='allday')S.allday.push(target);else S.events.push(target);
  save();closeModal();render();
}

function saveAllday(){
  var t=$('#f-adtitle').value.trim();
  if(!t){bad('#f-adtitle');return;}
  var data={title:t,color:M.color,date:null,days:null,end:null,from:null,to:null};
  if(M.mode==='once'){var dt=$('#f-addate').value,de=($('#f-adew').style.display==='none')?null:($('#f-adend').value||null);if(!dt){bad('#f-addate');return;}if(de&&de<dt){bad('#f-adend');return;}data.date=dt;data.end=(de&&de!==dt)?de:null;}
  else{if(!M.days.length){$('#f-adays').style.outline='2px solid var(--now)';return;}data.days=M.days.slice().sort();data.from=$('#f-adfrom').value||null;data.to=$('#f-adto').value||null;if(data.from&&data.to&&data.to<data.from){bad('#f-adto');return;}}

function chatPhotoSrc(p){return typeof p==='string'?p:p&&p.src||'';}
function chatPhotosOf(m){return Array.isArray(m.photos)?m.photos:(m.photo?[m.photo]:[]);}
function chatRoomData(includeHidden){
  var hidden=S.settings.chatHidden||{},names=S.settings.chatRoomNames||{},rooms=[{id:'general',label:'나와의 채팅',kind:'general'}];
  courseNames().forEach(function(n){var id='course:'+n;if(includeHidden||!hidden[id])rooms.push({id:id,label:names[id]||n,kind:'course',hidden:!!hidden[id]});});
  (S.settings.chatRooms||[]).forEach(function(r){if(r&&r.id&&(includeHidden||!hidden[r.id]))rooms.push({id:r.id,label:r.name||'프로젝트',kind:'custom',hidden:!!hidden[r.id]});});
  return rooms;
}
function chatRoomLabel(room){var found=chatRoomData(true).find(function(r){return r.id===room;});return found?found.label:(room==='general'?'나와의 채팅':room.indexOf('course:')===0?room.slice(7):'프로젝트');}

function chatListHTML(){
  var q=(U.chatQuery||'').trim().toLowerCase(),room=U.chatRoom||'general',last='',html='';
  S.selfchat.slice().sort(function(a,b){return a.at-b.at;}).filter(function(m){
    if((m.room||'general')!==room)return false;
    if(!q)return true;
    return (m.text||'').toLowerCase().indexOf(q)>=0||new Date(m.at).toLocaleDateString('ko-KR').indexOf(q)>=0;
  }).forEach(function(m){
    var d=new Date(m.at),k=dkey(d);
    if(k!==last){html+='<div class="cdate">'+mdTxt(d)+' '+DAYS[dow(d)]+'요일</div>';last=k;}
    var sel=U.chatSel===m.id,photos=chatPhotosOf(m);
    var ph=photos.length?'<div class="cphotos">'+photos.map(function(p,i){return '<button class="cphoto" data-act="chat-photo" data-id="'+m.id+'" data-pi="'+i+'"><img src="'+chatPhotoSrc(p)+'" alt="채팅 사진"></button>';}).join('')+'</div>':'';
    var tx=m.text?'<button class="cbub" data-act="chat-sel" data-id="'+m.id+'">'+esc(m.text)+'</button>':'';
    html+='<div class="cmsg'+(sel?' sel':'')+'"><span class="ctime">'+pad(d.getHours())+':'+pad(d.getMinutes())+'</span>'+ph+tx+'<button class="chat-more" data-act="chat-sel" data-id="'+m.id+'" aria-label="메시지 메뉴">⋯</button></div>'+
      (sel?'<div class="cops">'+(m.text?'<button class="tbtn" data-act="chat-copy" data-id="'+m.id+'">복사</button>':'')+'<button class="tbtn cdel" data-act="chat-del" data-id="'+m.id+'">삭제</button></div>':'');
  });
  return html||'<div class="empty" style="text-align:center;margin:auto">'+(q?'검색 결과가 없어요':'생각나는 걸 편하게 보내봐요')+'</div>';
}
